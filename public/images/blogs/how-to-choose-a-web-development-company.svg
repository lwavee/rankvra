    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#b45309" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="88" y="67" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">BUYER EVALUATION</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">How to Choose a Web Development Agency</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">The 5 Vetting Criteria to Separate Engineering Powerhouses from Template Resellers</text>

  <!-- Split Vetting Arena -->
  <g transform="translate(70, 205)">
    <!-- Red Flags -->
    <rect x="0" y="0" width="490" height="385" rx="20" fill="#2d0a14" stroke="#ef4444" stroke-width="2" filter="url(#soft-shadow-choose-co)"/>
    <rect x="30" y="25" width="180" height="32" rx="10" fill="#991b1b"/>
    <text x="45" y="46" fill="#fee2e2" font-family="system-ui, sans-serif" font-size="13" font-weight="800">⚠️ RED FLAGS TO AVOID</text>
    <text x="30" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Low-Tier Agencies</text>
    
    <rect x="30" y="115" width="430" height="46" rx="10" fill="#7f1d1d"/>
    <text x="45" y="143" fill="#fee2e2" font-family="system-ui, sans-serif" font-size="13">❌ Over-reliance on generic pre-built WordPress themes</text>
    <rect x="30" y="170" width="430" height="46" rx="10" fill="#7f1d1d"/>
    <text x="45" y="198" fill="#fee2e2" font-family="system-ui, sans-serif" font-size="13">❌ No code repositories, version control, or CI/CD pipelines</text>
    <rect x="30" y="225" width="430" height="46" rx="10" fill="#7f1d1d"/>
    <text x="45" y="253" fill="#fee2e2" font-family="system-ui, sans-serif" font-size="13">❌ Unclear IP ownership &amp; lack of post-launch SLA contracts</text>
    <rect x="30" y="280" width="430" height="46" rx="10" fill="#7f1d1d"/>
    <text x="45" y="308" fill="#fee2e2" font-family="system-ui, sans-serif" font-size="13">❌ Fixed low quotes with massive hidden change-request fees</text>
  </g>


    <rect x="6" y="55" width="14" height="32" rx="7" fill="#334155"/>
    <rect x="100" y="55" width="14" height="32" rx="7" fill="#334155"/>
  </g>

    <rect x="30" y="295" width="240" height="50" rx="12" fill="#047857"/>
    <text x="50" y="326" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">RankVRA Gold Standard</text>

    <text x="45" y="143" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="13">✔ Custom Next.js &amp; TypeScript architecture tailored to ROI</text>
    <rect x="30" y="170" width="450" height="46" rx="10" fill="#065f46"/>
    <text x="45" y="198" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="13">✔ Verifiable live case studies with real Lighthouse 95+ scores</text>

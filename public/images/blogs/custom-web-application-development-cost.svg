<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-app-cost" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-app-cost" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-app-cost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06281e"/>
      <stop offset="50%" stop-color="#091c18"/>
      <stop offset="100%" stop-color="#030a08"/>
    </linearGradient>
    <linearGradient id="glass-app-cost" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-app-cost)"/>
  <circle cx="220" cy="170" r="280" fill="#10b981" opacity="0.25" filter="url(#glow-app-cost)"/>
  <circle cx="1020" cy="460" r="290" fill="#f59e0b" opacity="0.24" filter="url(#glow-app-cost)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
  <text x="88" y="67" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">FINANCIAL PLANNING</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">Web Application Development Cost</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Cost Breakdown by Complexity Tier, Team Distribution &amp; Cloud Maintenance</text>

  <!-- 3 Pricing Tier Cards -->
  <g transform="translate(70, 205)">
    <!-- MVP Tier -->
    <rect x="0" y="0" width="330" height="385" rx="18" fill="#0b241d" stroke="#10b981" stroke-width="1.8" filter="url(#soft-shadow-app-cost)"/>
    <rect x="25" y="25" width="120" height="26" rx="8" fill="#047857"/>
    <text x="35" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">STAGE 1</text>
    <text x="25" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">MVP / Prototype</text>
    <text x="25" y="125" fill="#34d399" font-family="system-ui, sans-serif" font-size="28" font-weight="900">$3,000 – $8,000</text>
    <text x="25" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">₹2.5L – ₹6.5L INR</text>
    
    <rect x="25" y="175" width="280" height="38" rx="8" fill="#134e4a"/>
    <text x="35" y="199" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">✔ Core CRUD Workflows</text>
    <rect x="25" y="220" width="280" height="38" rx="8" fill="#134e4a"/>
    <text x="35" y="244" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">✔ User Auth &amp; Dashboard</text>
    <rect x="25" y="265" width="280" height="38" rx="8" fill="#134e4a"/>
    <text x="35" y="289" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">✔ 4–6 Weeks Time to Market</text>
    
    <rect x="25" y="320" width="280" height="42" rx="10" fill="#047857"/>
    <text x="80" y="346" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Rapid Validation</text>

    <!-- Mid-Market Tier -->
    <rect x="365" y="0" width="330" height="385" rx="18" fill="#2d1c07" stroke="#f59e0b" stroke-width="2" filter="url(#soft-shadow-app-cost)"/>
    <rect x="390" y="25" width="130" height="26" rx="8" fill="#b45309"/>
    <text x="400" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">STAGE 2 (POPULAR)</text>
    <text x="390" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Custom SaaS App</text>
    <text x="390" y="125" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="28" font-weight="900">$10,000 – $25,000</text>
    <text x="390" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">₹8L – ₹20L INR</text>
    
    <rect x="390" y="175" width="280" height="38" rx="8" fill="#78350f"/>
    <text x="400" y="199" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">✔ Multi-Tenant Architecture</text>
    <rect x="390" y="220" width="280" height="38" rx="8" fill="#78350f"/>
    <text x="400" y="244" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">✔ Stripe / Razorpay Billing Hub</text>
    <rect x="390" y="265" width="280" height="38" rx="8" fill="#78350f"/>
    <text x="400" y="289" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">✔ 8–14 Weeks Delivery</text>
    
    <rect x="390" y="320" width="280" height="42" rx="10" fill="#d97706"/>
    <text x="450" y="346" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Commercial Ready</text>

    <!-- Enterprise Tier -->
    <rect x="730" y="0" width="330" height="385" rx="18" fill="#1b122e" stroke="#c084fc" stroke-width="1.8" filter="url(#soft-shadow-app-cost)"/>
    <rect x="755" y="25" width="120" height="26" rx="8" fill="#6b21a8"/>
    <text x="765" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">STAGE 3</text>
    <text x="755" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Enterprise Platform</text>
    <text x="755" y="125" fill="#e879f9" font-family="system-ui, sans-serif" font-size="28" font-weight="900">$30,000 – $75,000+</text>
    <text x="755" y="150" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">₹25L – ₹60L+ INR</text>
    
    <rect x="755" y="175" width="280" height="38" rx="8" fill="#4c1d95"/>
    <text x="765" y="199" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">✔ High-Concurrency Engine</text>
    <rect x="755" y="220" width="280" height="38" rx="8" fill="#4c1d95"/>
    <text x="765" y="244" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">✔ SOC2 / HIPAA Compliance</text>
    <rect x="755" y="265" width="280" height="38" rx="8" fill="#4c1d95"/>
    <text x="765" y="289" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">✔ Dedicated Cloud DevOps</text>
    
    <rect x="755" y="320" width="280" height="42" rx="10" fill="#7e22ce"/>
    <text x="815" y="346" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Mission Critical</text>
  </g>
</svg>
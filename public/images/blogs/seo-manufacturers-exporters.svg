  </defs>
  <!-- Glow Accents -->
  <circle cx="200" cy="180" r="220" fill="#0284c7" opacity="0.2" filter="url(#b1)"/>
  <circle cx="1000" cy="420" r="220" fill="#059669" opacity="0.18" filter="url(#b2)"/>

  <!-- Badge -->

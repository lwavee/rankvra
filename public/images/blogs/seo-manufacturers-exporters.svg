    <text x="24" y="45" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">PIPELINE CAPTURE</text>
    <text x="24" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Direct Wholesale RFQ</text>
    <text x="24" y="115" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Direct container-load quantity fields</text>
    <text x="24" y="138" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Instant WhatsApp export desk notification</text>
    <text x="24" y="161" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Zero middleman directory commissions</text>

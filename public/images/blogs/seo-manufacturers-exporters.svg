  <!-- RankVRA Signature -->
  <text x="1120" y="585" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="end">RankVRA B2B Strategy &#8226; Udaipur</text>

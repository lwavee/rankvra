    <text x="24" y="138" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Downloadable PDF engineering data</text>
    <text x="24" y="161" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Indexed by procurement engineers</text>

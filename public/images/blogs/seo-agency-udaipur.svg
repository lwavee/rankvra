<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" rx="24" fill="#0f172a"/>
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <defs>
    <filter id="b1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="b2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>
  <!-- Glow Accents -->
  <circle cx="200" cy="150" r="220" fill="#4f46e5" opacity="0.2" filter="url(#b1)"/>
  <circle cx="1000" cy="450" r="240" fill="#06b6d4" opacity="0.15" filter="url(#b2)"/>

  <!-- Badge -->
  <rect x="80" y="70" width="230" height="38" rx="19" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="100" y="94" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">SEO AGENCY UDAIPUR</text>

  <!-- Title & Subtitle -->
  <text x="80" y="160" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">How to Choose the Right</text>
  <text x="80" y="215" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">SEO Partner in Udaipur</text>
  <text x="80" y="265" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">Evaluating technical capabilities, vetting red flags &amp; setting realistic growth expectations.</text>

  <!-- Evaluation Framework Card 1: The 4 Pillars -->
  <g transform="translate(80, 310)">
    <rect width="320" height="240" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="24" y="24" width="44" height="44" rx="12" fill="#312e81"/>
    <path d="M46 38v16m-8-8h16" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="24" y="105" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">1. Technical &amp; Code Health</text>
    <text x="24" y="135" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">Sub-second Core Web Vitals, clean</text>
    <text x="24" y="158" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">crawling, canonicals &amp; schema markup.</text>
    <rect x="24" y="190" width="130" height="24" rx="6" fill="#4f46e5" opacity="0.2"/>
    <text x="34" y="206" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">FOUNDATIONAL AUDIT</text>
  </g>

  <!-- Evaluation Framework Card 2: Local Pack & Maps -->
  <g transform="translate(430, 310)">
    <rect width="320" height="240" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="24" y="24" width="44" height="44" rx="12" fill="#065f46"/>
    <circle cx="46" cy="46" r="8" stroke="#34d399" stroke-width="2.5"/>
    <text x="24" y="105" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">2. Google Maps 3-Pack</text>
    <text x="24" y="135" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">Udaipur local citations, NAP consistency,</text>
    <text x="24" y="158" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">ethical review pipelines &amp; geotags.</text>
    <rect x="24" y="190" width="125" height="24" rx="6" fill="#10b981" opacity="0.2"/>
    <text x="34" y="206" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">LOCAL DOMINANCE</text>
  </g>

  <!-- Evaluation Framework Card 3: Real Inquiries & ROI -->
  <g transform="translate(780, 310)">
    <rect width="340" height="240" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="24" y="24" width="44" height="44" rx="12" fill="#701a75"/>
    <path d="M38 52l6-8 5 5 9-11" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="105" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">3. Verified Lead Pipelines</text>
    <text x="24" y="135" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">Phone calls &amp; WhatsApp inquiries</text>
    <text x="24" y="158" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">tracked directly to commercial terms.</text>
    <rect x="24" y="190" width="120" height="24" rx="6" fill="#ec4899" opacity="0.2"/>
    <text x="34" y="206" fill="#fbcfe8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">REVENUE OVER CLICKS</text>
  </g>

  <!-- RankVRA Signature -->
  <text x="1120" y="585" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="end">RankVRA Research &#8226; Udaipur</text>
</svg>

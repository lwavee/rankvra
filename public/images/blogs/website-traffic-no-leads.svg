<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" rx="24" fill="#0f172a"/>
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <defs>
    <filter id="b1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="b2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>
  <!-- Glow Accents -->
  <circle cx="200" cy="180" r="220" fill="#dc2626" opacity="0.16" filter="url(#b1)"/>
  <circle cx="1000" cy="420" r="220" fill="#4f46e5" opacity="0.18" filter="url(#b2)"/>

  <!-- Badge -->
  <rect x="80" y="70" width="220" height="38" rx="19" fill="#450a0a" stroke="#dc2626" stroke-width="1.5"/>
  <text x="100" y="94" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">CONVERSION OPTIMIZATION</text>

  <!-- Title & Subtitle -->
  <text x="80" y="160" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Why Your Website Gets Traffic</text>
  <text x="80" y="215" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">but Zero Qualified Leads</text>
  <text x="80" y="265" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">10 high-friction conversion bottlenecks that drain marketing budgets &amp; how to fix them today.</text>

  <!-- 3 Major Conversion Failure Points -->
  <g transform="translate(80, 310)">
    <rect width="320" height="240" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="45" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">LEAK 01 &#8226; HERO AREA</text>
    <text x="24" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Vague Value Proposition</text>
    <text x="24" y="115" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">Fails the 3-second test. Visitors cannot</text>
    <text x="24" y="138" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">immediately tell what you offer, who</text>
    <text x="24" y="161" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">it helps, and why they should choose you.</text>
    <rect x="24" y="190" width="125" height="24" rx="6" fill="#dc2626" opacity="0.2"/>
    <text x="34" y="206" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">HIGH IMMEDIATE EXIT</text>
  </g>

  <g transform="translate(430, 310)">
    <rect width="320" height="240" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="45" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">LEAK 02 &#8226; FORM DESIGN</text>
    <text x="24" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Form Friction &amp; No Chat</text>
    <text x="24" y="115" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">Demanding 8+ inputs on step one.</text>
    <text x="24" y="138" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">Lack of 1-tap WhatsApp direct contact</text>
    <text x="24" y="161" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">causes 70%+ mobile abandonment.</text>
    <rect x="24" y="190" width="130" height="24" rx="6" fill="#dc2626" opacity="0.2"/>
    <text x="34" y="206" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">SUBMISSION DROP-OFF</text>
  </g>

  <g transform="translate(780, 310)">
    <rect width="340" height="240" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="24" y="45" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">SOLUTION &#8226; RANKVRA CRO</text>
    <text x="24" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">High-Converting Funnel</text>
    <text x="24" y="115" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Concise 3-field audit inquiry</text>
    <text x="24" y="138" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; 1-click WhatsApp messaging</text>
    <text x="24" y="161" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; &lt; 1-second mobile load speeds</text>
    <rect x="24" y="190" width="135" height="24" rx="6" fill="#10b981" opacity="0.2"/>
    <text x="34" y="206" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">3X CONVERSION LIFT</text>
  </g>

  <!-- RankVRA Signature -->
  <text x="1120" y="585" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="end">RankVRA CRO &#8226; Udaipur</text>
</svg>

<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-no-leads" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-no-leads" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-no-leads" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#260a16"/>
      <stop offset="50%" stop-color="#3d0f24"/>
      <stop offset="100%" stop-color="#0d0208"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-no-leads)"/>
  <circle cx="220" cy="170" r="280" fill="#f43f5e" opacity="0.25" filter="url(#glow-no-leads)"/>
  <circle cx="1020" cy="460" r="290" fill="#f59e0b" opacity="0.24" filter="url(#glow-no-leads)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">

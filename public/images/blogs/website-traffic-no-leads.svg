    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#9f1239" stroke="#fb7185" stroke-width="1.5"/>
  <text x="88" y="67" fill="#ffe4e6" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">LEAK DIAGNOSIS</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">Website Traffic But No Leads?</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">The 4 Critical Funnel Leaks &amp; How to Convert High Visitors into High-Value Inquiries</text>

  <!-- 4 Diagnostic Cards -->
  <g transform="translate(70, 205)">
    <!-- Leak 1 -->
    <rect x="0" y="0" width="250" height="385" rx="18" fill="#300d1c" stroke="#f43f5e" stroke-width="1.8" filter="url(#soft-shadow-no-leads)"/>
    <circle cx="45" cy="45" r="20" fill="#9f1239"/>
    <text x="36" y="52" fill="#ffffff" font-size="16">⚠️</text>
    <text x="25" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Friction Forms</text>
    <text x="25" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">12-field intimidating contact forms causing 78% immediate drop-off.</text>
    <rect x="25" y="200" width="200" height="36" rx="8" fill="#881337"/>
    <text x="35" y="223" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Fix: 2-Step WhatsApp CTA</text>

    <!-- Leak 2 -->
    <rect x="270" y="0" width="250" height="385" rx="18" fill="#2d1607" stroke="#f59e0b" stroke-width="1.8" filter="url(#soft-shadow-no-leads)"/>
    <circle cx="315" cy="45" r="20" fill="#b45309"/>
    <text x="306" y="52" fill="#ffffff" font-size="16">🐢</text>
    <text x="295" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Slow Loading</text>
    <text x="295" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Mobile page takes &gt; 4 seconds to load; 53% abandon before first render.</text>
    <rect x="295" y="200" width="200" height="36" rx="8" fill="#78350f"/>
    <text x="305" y="223" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Fix: Next.js SSR &lt; 800ms</text>

    <!-- Leak 3 -->
    <rect x="540" y="0" width="250" height="385" rx="18" fill="#1c0f2e" stroke="#a855f7" stroke-width="1.8" filter="url(#soft-shadow-no-leads)"/>
    <circle cx="585" cy="45" r="20" fill="#6b21a8"/>
    <text x="576" y="52" fill="#ffffff" font-size="16">❓</text>
    <text x="565" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Vague Value Prop</text>
    <text x="565" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Generic slogans with no pricing, deliverables, or customer proof.</text>
    <rect x="565" y="200" width="200" height="36" rx="8" fill="#581c87"/>
    <text x="575" y="223" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Fix: Clear ROI Statement</text>

    <!-- Leak 4: AI Diagnostic Bot -->
    <rect x="810" y="0" width="250" height="385" rx="18" fill="#08281a" stroke="#10b981" stroke-width="1.8" filter="url(#soft-shadow-no-leads)"/>
    <circle cx="855" cy="45" r="20" fill="#047857"/>
    <text x="846" y="52" fill="#ffffff" font-size="16">🩺</text>
    <text x="835" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">CRO Diagnostic</text>
    <text x="835" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Full audit reveals user heatmaps, drop-off hotspots &amp; instant quick wins.</text>
    
  <g transform="translate(870, 185) scale(0.95)">
    <ellipse cx="60" cy="118" rx="38" ry="12" fill="#10b981" opacity="0.35"/>
    <ellipse cx="60" cy="118" rx="20" ry="6" fill="#ffffff" opacity="0.75"/>
    <rect x="25" y="42" width="70" height="66" rx="22" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <rect x="33" y="50" width="54" height="42" rx="14" fill="#0f172a"/>
    <circle cx="60" cy="71" r="10" fill="#10b981"/>
    <circle cx="60" cy="71" r="4" fill="#ffffff"/>
    <rect x="18" y="6" width="84" height="46" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <rect x="26" y="14" width="68" height="28" rx="12" fill="#090d16" stroke="#10b981" stroke-width="1.5"/>
    <ellipse cx="44" cy="27" rx="8" ry="6" fill="#10b981"/>
    <circle cx="46" cy="25" r="2.5" fill="#ffffff"/>
    <ellipse cx="76" cy="27" rx="8" ry="6" fill="#10b981"/>
    <circle cx="78" cy="25" r="2.5" fill="#ffffff"/>
    <line x1="60" y1="6" x2="60" y2="-4" stroke="#64748b" stroke-width="3"/>
    <circle cx="60" cy="-6" r="5" fill="#10b981"/>
    <rect x="6" y="55" width="14" height="32" rx="7" fill="#334155"/>
    <rect x="100" y="55" width="14" height="32" rx="7" fill="#334155"/>
  </g>

    <rect x="835" y="325" width="200" height="36" rx="8" fill="#047857"/>
    <text x="850" y="348" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Leads Restored +180%</text>
  </g>
</svg>
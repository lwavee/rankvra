<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="80"/></filter>
  </defs>
  <rect width="1200" height="630" rx="24" fill="#090d16"/>
  <circle cx="200" cy="180" r="240" fill="#8b5cf6" opacity="0.18" filter="url(#glow1)"/>
  <circle cx="1000" cy="460" r="260" fill="#ec4899" opacity="0.16" filter="url(#glow2)"/>
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/><line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/><line x1="450" y1="0" x2="450" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="750" y1="0" x2="750" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/><line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>
  <rect x="80" y="55" width="290" height="34" rx="17" fill="#4a044e" stroke="#ec4899" stroke-width="1.2"/>
  <text x="96" y="77" fill="#f472b6" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">STRATEGIC BUILD VS BUY FRAMEWORK</text>
  <text x="80" y="135" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">Custom Software vs SaaS Decision Matrix</text>
  <text x="80" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Evaluating Subscription Costs, Workflow Moats, IP Ownership &amp; Scalability</text>

  <g transform="translate(80, 220)">
    <!-- Option A: Off-the-Shelf SaaS -->
    <g transform="translate(0, 0)">
      <rect width="320" height="330" rx="16" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
      <rect x="20" y="20" width="120" height="26" rx="6" fill="#1e293b"/>
      <text x="32" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">BUY OFF-THE-SHELF</text>
      <text x="20" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="19" font-weight="800">Commercial SaaS</text>
      <text x="20" y="105" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13">Commodity business processes</text>
      <line x1="20" y1="125" x2="300" y2="125" stroke="#1e293b"/>
      <text x="20" y="155" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">⚡ Instant Day-1 Deployment</text>
      <text x="20" y="185" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">🔒 Vendor handles security &amp; patches</text>
      <text x="20" y="215" fill="#f87171" font-family="system-ui, sans-serif" font-size="13">⚠️ Per-seat pricing compounds rapidly</text>
      <text x="20" y="245" fill="#f87171" font-family="system-ui, sans-serif" font-size="13">⚠️ Workflows forced to match vendor</text>
      <text x="20" y="275" fill="#f87171" font-family="system-ui, sans-serif" font-size="13">⚠️ Data lock-in &amp; API rate limits</text>
      <rect x="20" y="295" width="280" height="25" rx="6" fill="#1e293b"/>
      <text x="160" y="312" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Best: Email, Accounting, Chat</text>
    </g>

    <!-- Option B: Custom Internal Software -->
    <g transform="translate(360, 0)">
      <rect width="320" height="330" rx="16" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
      <rect x="20" y="20" width="140" height="26" rx="6" fill="#2e1065"/>
      <text x="32" y="38" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700">BUILD PROPRIETARY</text>
      <text x="20" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="19" font-weight="800">Custom Software</text>
      <text x="20" y="105" fill="#34d399" font-family="system-ui, sans-serif" font-size="13">Tailored operational advantage</text>
      <line x1="20" y1="125" x2="300" y2="125" stroke="#1e293b"/>
      <text x="20" y="155" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">🎯 100% Exact Workflow Alignment</text>
      <text x="20" y="185" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">💼 Zero Monthly Seat License Fees</text>
      <text x="20" y="215" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">🛡️ Complete Data Sovereignty &amp; IP</text>
      <text x="20" y="245" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">🔌 Seamless Legacy System APIs</text>
      <text x="20" y="275" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13">📈 Becomes a Tangible Balance Asset</text>
      <rect x="20" y="295" width="280" height="25" rx="6" fill="#2e1065"/>
      <text x="160" y="312" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Best: Core Moats, Portals, Ops</text>
    </g>

    <!-- Option C: Commercial SaaS Product -->
    <g transform="translate(720, 0)">
      <rect width="320" height="330" rx="16" fill="#0f172a" stroke="#ec4899" stroke-width="1.5"/>
      <rect x="20" y="20" width="130" height="26" rx="6" fill="#500724"/>
      <text x="32" y="38" fill="#f472b6" font-family="system-ui, sans-serif" font-size="12" font-weight="700">BUILD TO SELL</text>
      <text x="20" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="19" font-weight="800">Commercial SaaS</text>
      <text x="20" y="105" fill="#f472b6" font-family="system-ui, sans-serif" font-size="13">Multi-tenant recurring revenue</text>
      <line x1="20" y1="125" x2="300" y2="125" stroke="#1e293b"/>
      <text x="20" y="155" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">💰 High Margin Recurring Revenue</text>
      <text x="20" y="185" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">🏢 Multi-Tenant DB Partitioning</text>
      <text x="20" y="215" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">💳 Automated Stripe Billing / Tiers</text>
      <text x="20" y="245" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">📈 Venture / Private Equity Multiple</text>
      <text x="20" y="275" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">🌐 Global B2B Distribution</text>
      <rect x="20" y="295" width="280" height="25" rx="6" fill="#500724"/>
      <text x="160" y="312" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Best: Digital Products &amp; Startups</text>
    </g>
  </g>
</svg>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-cro-funnel" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-cro-funnel" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-cro-funnel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1506"/>
      <stop offset="50%" stop-color="#3d2008"/>
      <stop offset="100%" stop-color="#0f0702"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-cro-funnel)"/>
  <circle cx="220" cy="170" r="280" fill="#f59e0b" opacity="0.25" filter="url(#glow-cro-funnel)"/>
  <circle cx="1020" cy="460" r="290" fill="#10b981" opacity="0.24" filter="url(#glow-cro-funnel)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#b45309" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="88" y="67" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">REVENUE ACCELERATION</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">Conversion Rate Optimization (CRO)</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Transform Traffic into Paying Clients via UX Friction Elimination &amp; A/B Split Testing</text>

  <!-- Funnel Visualization Arena -->
  <g transform="translate(70, 205)">
    <!-- Funnel Stage 1 -->
    <rect x="0" y="0" width="700" height="75" rx="14" fill="#451a03" stroke="#f59e0b" stroke-width="2" filter="url(#soft-shadow-cro-funnel)"/>
    <text x="30" y="44" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="15" font-weight="800">1. IMPRESSIONS &amp; CLICKS</text>
    <text x="320" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">100,000 Visitors</text>
    <rect x="520" y="18" width="150" height="38" rx="8" fill="#78350f"/>
    <text x="545" y="42" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Top of Funnel</text>

    <!-- Funnel Stage 2 -->
    <rect x="50" y="90" width="600" height="75" rx="14" fill="#381e05" stroke="#f59e0b" stroke-width="2" filter="url(#soft-shadow-cro-funnel)"/>
    <text x="80" y="134" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="15" font-weight="800">2. ENGAGED PRODUCT VISITS</text>
    <text x="360" y="134" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">32,000 Active</text>
    <rect x="490" y="108" width="130" height="38" rx="8" fill="#78350f"/>
    <text x="512" y="132" fill="#fde68a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">32% Retention</text>

    <!-- Funnel Stage 3 -->
    <rect x="100" y="180" width="500" height="75" rx="14" fill="#202c11" stroke="#84cc16" stroke-width="2" filter="url(#soft-shadow-cro-funnel)"/>
    <text x="130" y="224" fill="#bef264" font-family="system-ui, sans-serif" font-size="15" font-weight="800">3. ADD TO CART / LEAD FORM</text>
    <text x="390" y="224" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">8,400 Starts</text>
    <rect x="450" y="198" width="120" height="38" rx="8" fill="#3f6212"/>
    <text x="475" y="222" fill="#ecfccb" font-family="system-ui, sans-serif" font-size="13" font-weight="700">8.4% Rate</text>

    <!-- Funnel Stage 4 (Wins) -->
    <rect x="150" y="270" width="400" height="85" rx="16" fill="#062e20" stroke="#10b981" stroke-width="2.5" filter="url(#soft-shadow-cro-funnel)"/>
    <text x="180" y="315" fill="#34d399" font-family="system-ui, sans-serif" font-size="17" font-weight="900">4. COMPLETED ORDERS</text>
    <text x="400" y="315" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900">4,200 Sales</text>
    <text x="180" y="340" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13">✔ RankVRA Conversion Lift: +140%</text>
  </g>

  <!-- Right Visual Stage: Mascot & A/B Metric Card -->
  <g transform="translate(805, 205)">
    <rect width="325" height="365" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#soft-shadow-cro-funnel)"/>
    <text x="30" y="45" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="16" font-weight="800">A/B TEST CHAMPION</text>
    
  <g transform="translate(95, 75) scale(1.25)">
    <ellipse cx="65" cy="130" rx="45" ry="12" fill="#000000" opacity="0.4"/>
    <path d="M 28 85 Q 65 60 102 85 L 110 125 L 20 125 Z" fill="#3b82f6"/>
    <path d="M 45 75 Q 65 65 85 75 L 85 85 Q 65 92 45 85 Z" fill="#1d4ed8"/>
    <circle cx="65" cy="46" r="30" fill="#fde047"/>
    <path d="M 38 42 Q 65 14 92 40 Q 82 22 65 24 Q 48 24 38 42 Z" fill="#92400e"/>
    <rect x="42" y="38" width="18" height="14" rx="4" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <rect x="70" y="38" width="18" height="14" rx="4" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <line x1="60" y1="44" x2="70" y2="44" stroke="#ffffff" stroke-width="2"/>
    <path d="M 57 56 Q 65 62 73 56" stroke="#92400e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <rect x="36" y="98" width="58" height="26" rx="4" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="30,124 100,124 94,128 36,128" fill="#475569"/>
    <rect x="42" y="103" width="46" height="16" rx="2" fill="#0f172a"/>
    <text x="46" y="115" fill="#10b981" font-family="monospace" font-size="8" font-weight="700">&lt;/dev&gt;</text>
  </g>

    <rect x="25" y="260" width="275" height="75" rx="12" fill="#1e293b"/>
    <text x="40" y="288" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Variant B: Sub-1s Next.js UI</text>
    <text x="40" y="310" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Conversion Rate: 4.2% vs 1.1%</text>
    <text x="40" y="325" fill="#facc15" font-family="system-ui, sans-serif" font-size="11">Statistical Significance: 99.8%</text>
  </g>
</svg>
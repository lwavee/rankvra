<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-cwv-next" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-cwv-next" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-cwv-next" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09241b"/>
      <stop offset="50%" stop-color="#0d382b"/>
      <stop offset="100%" stop-color="#030f0b"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-cwv-next)"/>
  <circle cx="220" cy="170" r="280" fill="#10b981" opacity="0.25" filter="url(#glow-cwv-next)"/>
  <circle cx="1020" cy="460" r="290" fill="#38bdf8" opacity="0.24" filter="url(#glow-cwv-next)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
  <text x="88" y="67" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">GOOGLE RANKING SIGNAL</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">Core Web Vitals in Next.js</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Mastering LCP, INP &amp; CLS for Dominant Search Rankings &amp; Conversions</text>

  <!-- 3 Vitals Dial Pillars -->
  <g transform="translate(70, 205)">
    <!-- LCP Pillar -->
    <rect x="0" y="0" width="320" height="385" rx="18" fill="#08241d" stroke="#10b981" stroke-width="2" filter="url(#soft-shadow-cwv-next)"/>
    <circle cx="160" cy="90" r="55" fill="none" stroke="#10b981" stroke-width="10"/>
    <text x="125" y="100" fill="#10b981" font-family="system-ui, sans-serif" font-size="28" font-weight="900">0.7s</text>
    <text x="45" y="175" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Largest Contentful Paint</text>
    <text x="35" y="202" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Target: &lt; 2.5s (RankVRA: 0.7s)</text>
    <rect x="25" y="225" width="270" height="50" rx="10" fill="#064e3b" fill-opacity="0.4"/>
    <text x="38" y="255" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12">⚡ Priority image preload &amp; edge HTML</text>
    <rect x="25" y="295" width="270" height="45" rx="10" fill="#047857"/>
    <text x="90" y="323" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">GOOD (Google Green)</text>

    <!-- INP Pillar -->
    <rect x="360" y="0" width="320" height="385" rx="18" fill="#08241d" stroke="#10b981" stroke-width="2" filter="url(#soft-shadow-cwv-next)"/>
    <circle cx="520" cy="90" r="55" fill="none" stroke="#10b981" stroke-width="10"/>
    <text x="480" y="100" fill="#10b981" font-family="system-ui, sans-serif" font-size="28" font-weight="900">42ms</text>
    <text x="390" y="175" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Interaction to Next Paint</text>
    <text x="395" y="202" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Target: &lt; 200ms (RankVRA: 42ms)</text>
    <rect x="385" y="225" width="270" height="50" rx="10" fill="#064e3b" fill-opacity="0.4"/>
    <text x="398" y="255" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12">⚡ React Transitions &amp; Main Thread Yield</text>
    <rect x="385" y="295" width="270" height="45" rx="10" fill="#047857"/>
    <text x="450" y="323" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">GOOD (Google Green)</text>

    <!-- CLS Pillar -->
    <rect x="720" y="0" width="340" height="385" rx="18" fill="#08241d" stroke="#10b981" stroke-width="2" filter="url(#soft-shadow-cwv-next)"/>
    <circle cx="890" cy="90" r="55" fill="none" stroke="#10b981" stroke-width="10"/>
    <text x="850" y="100" fill="#10b981" font-family="system-ui, sans-serif" font-size="28" font-weight="900">0.00</text>
    <text x="755" y="175" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Cumulative Layout Shift</text>
    <text x="765" y="202" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Target: &lt; 0.1 (RankVRA: 0.00)</text>
    <rect x="745" y="225" width="290" height="50" rx="10" fill="#064e3b" fill-opacity="0.4"/>
    <text x="758" y="255" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12">⚡ Explicit width/height aspect ratios</text>
    <rect x="745" y="295" width="290" height="45" rx="10" fill="#047857"/>
    <text x="815" y="323" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">ZERO SHIFT RECORD</text>
  </g>
</svg>
    <text x="25" y="310" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">3. Direct Call-to-Actions (CTAs)</text>
    <text x="25" y="338" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Sticky WhatsApp triggers, 1-click booking &amp; zero-friction quote forms.</text>
    <rect x="25" y="352" width="130" height="20" rx="10" fill="#b45309"/>
    <text x="36" y="366" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Frictionless Path</text>

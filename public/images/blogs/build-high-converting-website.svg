    <rect x="50" y="55" width="300" height="35" rx="8" fill="#1e293b"/>
    <circle cx="70" cy="72" r="8" fill="#10b981"/>
    
    <rect x="50" y="105" width="300" height="90" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1"/>

<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-high-conv" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-high-conv" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-high-conv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071f1a"/>
      <stop offset="50%" stop-color="#0d362d"/>
      <stop offset="100%" stop-color="#030d0a"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-high-conv)"/>
  <circle cx="220" cy="170" r="280" fill="#10b981" opacity="0.25" filter="url(#glow-high-conv)"/>
  <circle cx="1020" cy="460" r="290" fill="#06b6d4" opacity="0.24" filter="url(#glow-high-conv)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">

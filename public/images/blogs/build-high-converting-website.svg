    <text x="25" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">1. Instant Hook &amp; Hero Value</text>
    <text x="25" y="68" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Answers what, for whom, and why choose us within 3 seconds of load.</text>

<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-frontend" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-frontend" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-frontend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f132e"/>
      <stop offset="50%" stop-color="#110d24"/>
      <stop offset="100%" stop-color="#06040e"/>
    </linearGradient>
    <linearGradient id="glass-frontend" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-frontend)"/>
  <circle cx="220" cy="170" r="280" fill="#ec4899" opacity="0.25" filter="url(#glow-frontend)"/>
  <circle cx="1020" cy="460" r="290" fill="#f59e0b" opacity="0.24" filter="url(#glow-frontend)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#831843" stroke="#f472b6" stroke-width="1.5"/>
  <text x="88" y="67" fill="#fce7f3" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">MODERN UI ARCHITECTURE</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">Frontend Development Playbook</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Component Systems, State Machines, Web Vitals &amp; Fluid Aesthetics</text>

  <!-- Left: 3 Feature Blocks -->
  <g transform="translate(70, 205)">
    <rect x="0" y="0" width="400" height="115" rx="16" fill="#381026" stroke="#f43f5e" stroke-width="1.8" filter="url(#soft-shadow-frontend)"/>
    <text x="25" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">⚛️ Component Design System</text>
    <text x="25" y="68" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Atomic design, accessible ARIA primitives &amp; Tailwind token systems.</text>
    <rect x="25" y="82" width="120" height="20" rx="10" fill="#881337"/>
    <text x="36" y="96" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="11" font-weight="700">WCAG 2.1 AAA</text>

    <rect x="0" y="135" width="400" height="115" rx="16" fill="#351806" stroke="#f59e0b" stroke-width="1.8" filter="url(#soft-shadow-frontend)"/>
    <text x="25" y="175" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">⚡ Core Web Vitals Hyper-Speed</text>
    <text x="25" y="203" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Zero layout shift (CLS), instant response (INP) &amp; sub-second LCP.</text>
    <rect x="25" y="217" width="120" height="20" rx="10" fill="#78350f"/>
    <text x="36" y="231" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">100/100 Lighthouse</text>

    <rect x="0" y="270" width="400" height="115" rx="16" fill="#1e1338" stroke="#a855f7" stroke-width="1.8" filter="url(#soft-shadow-frontend)"/>
    <text x="25" y="310" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">🎨 Micro-Interactions &amp; Framer</text>
    <text x="25" y="338" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">GPU-accelerated spring animations and dynamic responsive state.</text>
    <rect x="25" y="352" width="120" height="20" rx="10" fill="#581c87"/>
    <text x="36" y="366" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Smooth 60 FPS</text>
  </g>

  <!-- Right Visual Stage: Developer Mascot & Component Wireframe -->
  <g transform="translate(500, 205)">
    <rect width="630" height="385" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#soft-shadow-frontend)"/>
    <!-- Wireframe Window -->
    <rect x="30" y="30" width="340" height="325" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="50" y="55" width="300" height="35" rx="8" fill="#1e293b"/>
    <circle cx="70" cy="72" r="8" fill="#ec4899"/>
    <rect x="90" y="66" width="120" height="12" rx="6" fill="#475569"/>
    
    <!-- Hero Box in Wireframe -->
    <rect x="50" y="105" width="300" height="110" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <rect x="70" y="125" width="160" height="14" rx="4" fill="#818cf8"/>
    <rect x="70" y="150" width="120" height="10" rx="4" fill="#475569"/>
    <rect x="70" y="172" width="80" height="24" rx="6" fill="#ec4899"/>
    
    <!-- Two small cards -->
    <rect x="50" y="230" width="140" height="100" rx="8" fill="#1e293b"/>
    <rect x="210" y="230" width="140" height="100" rx="8" fill="#1e293b"/>

    <!-- Developer Mascot Crafting it -->
    
  <g transform="translate(410, 80) scale(1.35)">
    <!-- Shadow -->
    <ellipse cx="65" cy="130" rx="45" ry="12" fill="#000000" opacity="0.4"/>
    <!-- Hoodie Body -->
    <path d="M 28 85 Q 65 60 102 85 L 110 125 L 20 125 Z" fill="#3b82f6"/>
    <!-- Hood Inner -->
    <path d="M 45 75 Q 65 65 85 75 L 85 85 Q 65 92 45 85 Z" fill="#1d4ed8"/>
    <!-- Head -->
    <circle cx="65" cy="46" r="30" fill="#fde047"/>
    <!-- Cool Hair -->
    <path d="M 38 42 Q 65 14 92 40 Q 82 22 65 24 Q 48 24 38 42 Z" fill="#92400e"/>
    <!-- Glasses -->
    <rect x="42" y="38" width="18" height="14" rx="4" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <rect x="70" y="38" width="18" height="14" rx="4" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <line x1="60" y1="44" x2="70" y2="44" stroke="#ffffff" stroke-width="2"/>
    <!-- Smile -->
    <path d="M 57 56 Q 65 62 73 56" stroke="#92400e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Laptop in hands -->
    <rect x="36" y="98" width="58" height="26" rx="4" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="30,124 100,124 94,128 36,128" fill="#475569"/>
    <!-- Screen Glow with code badge -->
    <rect x="42" y="103" width="46" height="16" rx="2" fill="#0f172a"/>
    <text x="46" y="115" fill="#ec4899" font-family="monospace" font-size="8" font-weight="700">&lt;/dev&gt;</text>
  </g>

    <rect x="390" y="270" width="220" height="60" rx="12" fill="#831843" stroke="#f472b6" stroke-width="1.5"/>
    <text x="408" y="295" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">UI ENGINEER APPROVED</text>
    <text x="408" y="315" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="11">Perfect visual polish &amp; speed</text>
  </g>
</svg>
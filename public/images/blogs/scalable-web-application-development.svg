    <rect x="0" y="0" width="320" height="385" rx="18" fill="#0d1b38" stroke="#3b82f6" stroke-width="1.8" filter="url(#soft-shadow-scale-app)"/>
    <circle cx="45" cy="45" r="20" fill="#1d4ed8"/>
    <text x="35" y="52" fill="#ffffff" font-size="16">🌐</text>

    <text x="755" y="52" fill="#ffffff" font-size="16">🗄️</text>
    <text x="745" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Sharded Data Store</text>
    <rect x="745" y="120" width="290" height="46" rx="8" fill="#064e3b" fill-opacity="0.4"/>
    <text x="760" y="148" fill="#34d399" font-family="system-ui, sans-serif" font-size="13">Read Replicas &amp; Write Masters</text>
    <rect x="745" y="176" width="290" height="46" rx="8" fill="#064e3b" fill-opacity="0.4"/>
    <text x="760" y="204" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Redis In-Memory Hot Cache</text>
    

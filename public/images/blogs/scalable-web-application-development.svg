<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-scale-app" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-scale-app" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-scale-app" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1228"/>
      <stop offset="50%" stop-color="#111b3d"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-scale-app)"/>
  <circle cx="220" cy="170" r="280" fill="#3b82f6" opacity="0.25" filter="url(#glow-scale-app)"/>
  <circle cx="1020" cy="460" r="290" fill="#8b5cf6" opacity="0.24" filter="url(#glow-scale-app)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">

<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-schema-mark" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-schema-mark" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-schema-mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12102e"/>
      <stop offset="50%" stop-color="#1c1845"/>
      <stop offset="100%" stop-color="#060512"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-schema-mark)"/>
  <circle cx="220" cy="170" r="280" fill="#6366f1" opacity="0.25" filter="url(#glow-schema-mark)"/>
  <circle cx="1020" cy="460" r="290" fill="#f59e0b" opacity="0.24" filter="url(#glow-schema-mark)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>
  <text x="88" y="67" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">STRUCTURED DATA ENGINE</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">Schema Markup &amp; Rich Snippets</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">JSON-LD Microdata for Star Ratings, FAQ Accordions &amp; Google Knowledge Graph</text>

  <!-- Left: Google Search Result Simulation -->
  <g transform="translate(70, 205)">
    <rect width="600" height="385" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#soft-shadow-schema-mark)"/>
    <rect x="30" y="25" width="160" height="28" rx="8" fill="#1e293b"/>
    <text x="42" y="44" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">GOOGLE SERP PREVIEW</text>

    <!-- Result Card -->
    <rect x="30" y="68" width="540" height="280" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <text x="50" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">https://rankvra.com › web-development › udaipur</text>
    <text x="50" y="130" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Best Web Development Company | RankVRA Engineering</text>
    <!-- Rich Snippet Stars -->
    <text x="50" y="160" fill="#facc15" font-family="system-ui, sans-serif" font-size="14">★★★★★ <tspan fill="#ffffff" font-weight="700">4.9</tspan> <tspan fill="#94a3b8">(128 reviews) · Pricing: ₹25,000+ · In stock</tspan></text>
    <text x="50" y="190" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Enterprise custom web development, Next.js web applications, and scalable API platforms built with sub-second performance.</text>
    
    <!-- FAQ Rich Dropdown -->
    <rect x="50" y="215" width="500" height="50" rx="8" fill="#1e293b"/>
    <text x="65" y="244" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Q: How fast does RankVRA deliver custom web applications?</text>
    <rect x="50" y="275" width="500" height="50" rx="8" fill="#1e293b"/>
    <text x="65" y="304" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Q: Does RankVRA offer full code ownership?</text>
  </g>

  <!-- Right: JSON-LD Code Block & Mascot -->
  <g transform="translate(700, 205)">
    <rect width="430" height="385" rx="20" fill="#090d16" stroke="#6366f1" stroke-width="2" filter="url(#soft-shadow-schema-mark)"/>
    <rect x="25" y="25" width="130" height="28" rx="8" fill="#312e81"/>
    <text x="35" y="44" fill="#a5b4fc" font-family="monospace" font-size="12" font-weight="700">&lt;script type="ld+json"&gt;</text>
    
    <text x="25" y="90" fill="#38bdf8" font-family="monospace" font-size="12">{</text>
    <text x="45" y="115" fill="#f472b6" font-family="monospace" font-size="12">"@context": "https://schema.org",</text>
    <text x="45" y="140" fill="#f472b6" font-family="monospace" font-size="12">"@type": "SoftwareApplication",</text>
    <text x="45" y="165" fill="#a5b4fc" font-family="monospace" font-size="12">"name": "RankVRA Core",</text>
    <text x="45" y="190" fill="#34d399" font-family="monospace" font-size="12">"aggregateRating": {</text>
    <text x="65" y="215" fill="#facc15" font-family="monospace" font-size="12">"ratingValue": "4.9",</text>
    <text x="65" y="240" fill="#facc15" font-family="monospace" font-size="12">"reviewCount": "128"</text>
    <text x="45" y="265" fill="#34d399" font-family="monospace" font-size="12">}</text>
    <text x="25" y="290" fill="#38bdf8" font-family="monospace" font-size="12">}</text>
    
    
  <g transform="translate(260, 220) scale(0.95)">
    <ellipse cx="60" cy="118" rx="38" ry="12" fill="#f59e0b" opacity="0.35"/>
    <ellipse cx="60" cy="118" rx="20" ry="6" fill="#ffffff" opacity="0.75"/>
    <rect x="25" y="42" width="70" height="66" rx="22" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <rect x="33" y="50" width="54" height="42" rx="14" fill="#0f172a"/>
    <circle cx="60" cy="71" r="10" fill="#f59e0b"/>
    <circle cx="60" cy="71" r="4" fill="#ffffff"/>
    <rect x="18" y="6" width="84" height="46" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <rect x="26" y="14" width="68" height="28" rx="12" fill="#090d16" stroke="#f59e0b" stroke-width="1.5"/>
    <ellipse cx="44" cy="27" rx="8" ry="6" fill="#f59e0b"/>
    <circle cx="46" cy="25" r="2.5" fill="#ffffff"/>
    <ellipse cx="76" cy="27" rx="8" ry="6" fill="#f59e0b"/>
    <circle cx="78" cy="25" r="2.5" fill="#ffffff"/>
    <line x1="60" y1="6" x2="60" y2="-4" stroke="#64748b" stroke-width="3"/>
    <circle cx="60" cy="-6" r="5" fill="#f59e0b"/>
    <rect x="6" y="55" width="14" height="32" rx="7" fill="#334155"/>
    <rect x="100" y="55" width="14" height="32" rx="7" fill="#334155"/>
  </g>

  </g>
</svg>
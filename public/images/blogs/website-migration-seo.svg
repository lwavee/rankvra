<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-mig" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-mig" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-mig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="acc-mig" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-mig)"/>
  <circle cx="200" cy="180" r="280" fill="#10b981" opacity="0.28" filter="url(#glow-mig)"/>
  <circle cx="1020" cy="450" r="300" fill="#38bdf8" opacity="0.25" filter="url(#glow-mig)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>


  <!-- Header -->
  <rect x="70" y="45" width="290" height="34" rx="17" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
  <text x="88" y="67" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">TECHNICAL SEO &amp; REDESIGN</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.8">Zero-Loss SEO Website Migration</text>
  <text x="70" y="160" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="16">1:1 301 Redirect Architecture, Crawl Parity &amp; Protecting Organic Keyword Equity</text>

  <!-- 3-Phase Migration Bridge Visual -->
  <g transform="translate(70, 195)">
    <!-- Phase 1: Pre-Migration Discovery -->
    <g transform="translate(0, 0)">
      <rect width="330" height="380" rx="22" fill="#0f172a" stroke="#0284c7" stroke-width="2" filter="url(#soft-shadow-mig)"/>
      <rect x="25" y="25" width="135" height="28" rx="8" fill="#0369a1"/>
      <text x="35" y="44" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="900">PHASE 1: DISCOVER</text>
      
      <text x="25" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900">Pre-Launch Audit</text>
      <text x="25" y="115" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13">Catalog 100% of historical assets</text>
      <line x1="25" y1="135" x2="305" y2="135" stroke="#1e293b"/>

      <text x="25" y="170" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">🔍 <tspan font-weight="700">Full Screaming Frog</tspan> site crawl</text>
      <text x="25" y="205" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">📊 <tspan font-weight="700">GSC 12-Month</tspan> top query inventory</text>
      <text x="25" y="240" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">🔗 <tspan font-weight="700">Ahrefs Backlink</tspan> top authority URLs</text>
      <text x="25" y="275" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">⚡ <tspan font-weight="700">Core Web Vitals</tspan> baseline metrics</text>

      <rect x="25" y="315" width="280" height="36" rx="10" fill="#0369a1"/>
      <text x="165" y="338" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Step 1: Benchmark Everything</text>
    </g>

    <!-- Phase 2: Migration Execution Bridge (CRITICAL) -->
    <g transform="translate(365, 0)">
      <rect width="350" height="380" rx="22" fill="#064e3b" stroke="#10b981" stroke-width="2.5" filter="url(#soft-shadow-mig)"/>
      <rect x="25" y="25" width="155" height="28" rx="8" fill="#047857"/>
      <text x="35" y="44" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="900">⭐ PHASE 2: LAUNCH</text>
      
      <text x="25" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900">301 Redirect Shield</text>
      <text x="25" y="115" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13">Zero link equity loss during DNS switch</text>
      <line x1="25" y1="135" x2="325" y2="135" stroke="#065f46"/>

      <text x="25" y="170" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">⇄ <tspan font-weight="900">1:1 Permanent 301 Redirects</tspan></text>
      <text x="25" y="205" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🛡️ <tspan font-weight="900">Zero Soft 404 Homepage Routing</tspan></text>
      <text x="25" y="240" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🏷️ <tspan font-weight="900">H1, Title &amp; Schema Parity</tspan></text>
      <text x="25" y="275" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🗺️ <tspan font-weight="900">Dynamic XML Sitemap Submit</tspan></text>

      <rect x="25" y="315" width="300" height="36" rx="10" fill="#047857" stroke="#34d399"/>
      <text x="175" y="338" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">Step 2: Protect All Link Equity</text>
    </g>

    <!-- Phase 3: Post-Launch Telemetry -->
    <g transform="translate(745, 0)">
      <rect width="330" height="380" rx="22" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" filter="url(#soft-shadow-mig)"/>
      <rect x="25" y="25" width="135" height="28" rx="8" fill="#3b0764"/>
      <text x="35" y="44" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="12" font-weight="900">PHASE 3: MONITOR</text>
      
      <text x="25" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900">Live Telemetry</text>
      <text x="25" y="115" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="13">30-day indexation monitoring</text>
      <line x1="25" y1="135" x2="305" y2="135" stroke="#312e81"/>

      <text x="25" y="170" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="13">📈 <tspan font-weight="700">GSC Crawl Stats</tspan> &amp; 404 logs</text>
      <text x="25" y="205" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="13">🔍 <tspan font-weight="700">Googlebot Access Log</tspan> analysis</text>
      <text x="25" y="240" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="13">🎯 <tspan font-weight="700">Daily Keyword Volatility</tspan> check</text>
      <text x="25" y="275" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="13">💰 <tspan font-weight="700">Form Conversion</tspan> verification</text>

      <rect x="25" y="315" width="280" height="36" rx="10" fill="#3b0764"/>
      <text x="165" y="338" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Step 3: Rapid Issue Remediation</text>
    </g>
  </g>
</svg>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-cost" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-cost" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-cost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#071612"/>
    </linearGradient>
    <linearGradient id="acc-cost" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glass-cost" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-cost)"/>
  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="280" fill="#10b981" opacity="0.28" filter="url(#glow-cost)"/>
  <circle cx="1020" cy="450" r="300" fill="#38bdf8" opacity="0.25" filter="url(#glow-cost)"/>
  <!-- Modern Tech Grid Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  
  <!-- Header -->
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
  <text x="88" y="67" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">FINANCIAL ARCHITECTURE 2026</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.8">Business Website Development Cost</text>
  <text x="70" y="160" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="16">14 Scope Drivers, Realistic Investment Tiers &amp; TCO Breakdown</text>

  <!-- Left: Stylized Cartoon Tech Founder Character -->
  <g transform="translate(70, 200)">
    <!-- Character Podium -->
    <ellipse cx="140" cy="380" rx="110" ry="22" fill="#042f2e" stroke="#14b8a6" stroke-width="2"/>
    
    <!-- Character Body -->
    <rect x="100" y="190" width="80" height="130" rx="28" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <path d="M 115 190 L 140 230 L 165 190" fill="#38bdf8"/>
    
    <!-- Head -->
    <circle cx="140" cy="130" r="42" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M 98 125 C 98 85, 182 85, 182 125 C 170 100, 110 100, 98 125 Z" fill="#451a03"/>
    <!-- Glasses -->
    <rect x="112" y="122" width="24" height="16" rx="4" fill="none" stroke="#0284c7" stroke-width="3"/>
    <rect x="144" y="122" width="24" height="16" rx="4" fill="none" stroke="#0284c7" stroke-width="3"/>
    <line x1="136" y1="130" x2="144" y2="130" stroke="#0284c7" stroke-width="3"/>
    <!-- Smile -->
    <path d="M 128 152 Q 140 162 152 152" stroke="#9a3412" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Tablet in Hand with Cost Breakdown -->
    <g transform="translate(160, 160) rotate(-6)">
      <rect width="115" height="165" rx="14" fill="#090d16" stroke="#34d399" stroke-width="2" filter="url(#soft-shadow-cost)"/>
      <rect x="12" y="16" width="91" height="14" rx="4" fill="#065f46"/>
      <text x="18" y="27" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9" font-weight="800">SCOPE ESTIMATE</text>
      <text x="14" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">UI/UX: $3,500</text>
      <text x="14" y="75" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Next.js: $5,500</text>
      <text x="14" y="95" fill="#facc15" font-family="system-ui, sans-serif" font-size="11" font-weight="700">CRM API: $2,500</text>
      <line x1="12" y1="110" x2="103" y2="110" stroke="#334155"/>
      <text x="14" y="130" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="900">Total: $11.5k</text>
      <circle cx="58" cy="152" r="5" fill="#34d399"/>
    </g>
  </g>

  <!-- Right: 3 Floating Tier Cards with Rich Accents -->
  <g transform="translate(370, 205)">
    <!-- Tier 1: Foundation -->
    <g transform="translate(0, 0)">
      <rect width="250" height="360" rx="20" fill="url(#glass-cost)" stroke="#065f46" stroke-width="2" filter="url(#soft-shadow-cost)"/>
      <rect x="20" y="20" width="105" height="26" rx="8" fill="#064e3b"/>
      <text x="32" y="38" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="800">FOUNDATION</text>
      <text x="20" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="900">5–15 Pages</text>
      <text x="20" y="105" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="800">$1,500 – $4,500</text>
      <line x1="20" y1="125" x2="230" y2="125" stroke="#1e293b"/>
      <text x="20" y="160" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">✓ Modern UI/UX Design</text>
      <text x="20" y="195" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">✓ Headless CMS / Clean WP</text>
      <text x="20" y="230" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">✓ Contact Form Automation</text>
      <text x="20" y="265" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">✓ Core SEO &amp; Schema</text>
      <rect x="20" y="305" width="210" height="34" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <text x="125" y="327" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Timeline: 3–5 Wks</text>
    </g>

    <!-- Tier 2: Custom Commercial Platform (POPULAR) -->
    <g transform="translate(275, 0)">
      <rect width="260" height="360" rx="20" fill="#042f2e" stroke="#10b981" stroke-width="2.5" filter="url(#soft-shadow-cost)"/>
      <rect x="20" y="20" width="135" height="26" rx="8" fill="#10b981"/>
      <text x="32" y="38" fill="#022c22" font-family="system-ui, sans-serif" font-size="11" font-weight="900">⭐ MOST POPULAR</text>
      <text x="20" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="900">Commercial Web</text>
      <text x="20" y="105" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="800">$5,000 – $15,000</text>
      <line x1="20" y1="125" x2="240" y2="125" stroke="#134e4a"/>
      <text x="20" y="160" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ 100% Bespoke Next.js / React</text>
      <text x="20" y="195" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Bi-Directional CRM Connectors</text>
      <text x="20" y="230" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Quote Calculators &amp; Stripe</text>
      <text x="20" y="265" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ 95+ Core Web Vitals (<1s LCP)</text>
      <rect x="20" y="305" width="220" height="34" rx="10" fill="#065f46" stroke="#34d399"/>
      <text x="130" y="327" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Timeline: 6–10 Wks</text>
    </g>

    <!-- Tier 3: Enterprise Web App -->
    <g transform="translate(560, 0)">
      <rect width="250" height="360" rx="20" fill="url(#glass-cost)" stroke="#0284c7" stroke-width="2" filter="url(#soft-shadow-cost)"/>
      <rect x="20" y="20" width="105" height="26" rx="8" fill="#0369a1"/>
      <text x="32" y="38" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11" font-weight="800">ENTERPRISE</text>
      <text x="20" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="900">Custom Portal</text>
      <text x="20" y="105" fill="#c084fc" font-family="system-ui, sans-serif" font-size="16" font-weight="800">$15,000 – $50,000+</text>
      <line x1="20" y1="125" x2="230" y2="125" stroke="#1e293b"/>
      <text x="20" y="160" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">✓ Multi-Tenant PostgreSQL &amp; Auth</text>
      <text x="20" y="195" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">✓ Broker / Client Portals</text>
      <text x="20" y="230" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">✓ Automated ERP &amp; BI Pipelines</text>
      <text x="20" y="265" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">✓ SOC2 &amp; OWASP Hardening</text>
      <rect x="20" y="305" width="210" height="34" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <text x="125" y="327" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Timeline: 12–20+ Wks</text>
    </g>
  </g>
</svg>
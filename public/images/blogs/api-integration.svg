<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-api-int" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-api-int" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-api-int" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071729"/>
      <stop offset="50%" stop-color="#0d2d47"/>
      <stop offset="100%" stop-color="#030a12"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-api-int)"/>
  <circle cx="220" cy="170" r="280" fill="#0284c7" opacity="0.25" filter="url(#glow-api-int)"/>
  <circle cx="1020" cy="460" r="290" fill="#10b981" opacity="0.24" filter="url(#glow-api-int)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="88" y="67" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">SYSTEM CONNECTIVITY</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">API Integration Architecture</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">REST, GraphQL &amp; Event-Driven Microservices Hub with Resilient Failover</text>

  <!-- Central Hub Layout -->
  <g transform="translate(70, 205)">
    <!-- Left Inbound Node -->
    <rect x="0" y="40" width="260" height="300" rx="16" fill="#0b1b2d" stroke="#0284c7" stroke-width="1.8" filter="url(#soft-shadow-api-int)"/>
    <text x="25" y="75" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="800">DATA SOURCES</text>
    <text x="25" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">External Systems</text>
    <rect x="25" y="130" width="210" height="42" rx="8" fill="#1e293b"/>
    <text x="35" y="156" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">💳 Stripe / Razorpay</text>
    <rect x="25" y="185" width="210" height="42" rx="8" fill="#1e293b"/>
    <text x="35" y="211" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">📦 Shiprocket / FedEx</text>
    <rect x="25" y="240" width="210" height="42" rx="8" fill="#1e293b"/>
    <text x="35" y="266" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">🏢 ERP / SAP Database</text>

    <!-- Connectors -->
    <path d="M 260 190 L 370 190" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4"/>

    <!-- Central API Gateway Hub -->
    <rect x="370" y="0" width="330" height="385" rx="20" fill="#102038" stroke="#38bdf8" stroke-width="2.5" filter="url(#soft-shadow-api-int)"/>
    <rect x="395" y="25" width="180" height="28" rx="8" fill="#0369a1"/>
    <text x="405" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">API GATEWAY CORE</text>
    <text x="395" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="900">Traffic Controller</text>
    
    <rect x="395" y="110" width="280" height="40" rx="8" fill="#1e293b"/>
    <text x="410" y="135" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">🛡️ Rate Limiting &amp; JWT Validation</text>
    <rect x="395" y="160" width="280" height="40" rx="8" fill="#1e293b"/>
    <text x="410" y="185" fill="#facc15" font-family="system-ui, sans-serif" font-size="12">⚡ Redis Caching (Sub-5ms)</text>
    <rect x="395" y="210" width="280" height="40" rx="8" fill="#1e293b"/>
    <text x="410" y="235" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">🔄 Automatic Retry &amp; Dead-Letter</text>

    
  <g transform="translate(475, 255) scale(0.85)">
    <ellipse cx="60" cy="118" rx="38" ry="12" fill="#38bdf8" opacity="0.35"/>
    <ellipse cx="60" cy="118" rx="20" ry="6" fill="#ffffff" opacity="0.75"/>
    <rect x="25" y="42" width="70" height="66" rx="22" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <rect x="33" y="50" width="54" height="42" rx="14" fill="#0f172a"/>
    <circle cx="60" cy="71" r="10" fill="#38bdf8"/>
    <circle cx="60" cy="71" r="4" fill="#ffffff"/>
    <rect x="18" y="6" width="84" height="46" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <rect x="26" y="14" width="68" height="28" rx="12" fill="#090d16" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="44" cy="27" rx="8" ry="6" fill="#38bdf8"/>
    <circle cx="46" cy="25" r="2.5" fill="#ffffff"/>
    <ellipse cx="76" cy="27" rx="8" ry="6" fill="#38bdf8"/>
    <circle cx="78" cy="25" r="2.5" fill="#ffffff"/>
    <line x1="60" y1="6" x2="60" y2="-4" stroke="#64748b" stroke-width="3"/>
    <circle cx="60" cy="-6" r="5" fill="#38bdf8"/>
    <rect x="6" y="55" width="14" height="32" rx="7" fill="#334155"/>
    <rect x="100" y="55" width="14" height="32" rx="7" fill="#334155"/>
  </g>


    <!-- Connectors -->
    <path d="M 700 190 L 800 190" stroke="#10b981" stroke-width="3" stroke-dasharray="6 4"/>

    <!-- Right Destination Node -->
    <rect x="800" y="40" width="260" height="300" rx="16" fill="#09241b" stroke="#10b981" stroke-width="1.8" filter="url(#soft-shadow-api-int)"/>
    <text x="825" y="75" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="800">INTERNAL APPS</text>
    <text x="825" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Consumer Endpoints</text>
    <rect x="825" y="130" width="210" height="42" rx="8" fill="#134e4a"/>
    <text x="835" y="156" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">⚛️ Next.js Web App</text>
    <rect x="825" y="185" width="210" height="42" rx="8" fill="#134e4a"/>
    <text x="835" y="211" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">📱 Mobile iOS/Android</text>
    <rect x="825" y="240" width="210" height="42" rx="8" fill="#134e4a"/>
    <text x="835" y="266" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">📊 Real-Time BI Warehouse</text>
  </g>
</svg>
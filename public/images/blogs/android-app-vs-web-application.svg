<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-android-web" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-android-web" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-android-web" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081729"/>
      <stop offset="50%" stop-color="#0d2847"/>
      <stop offset="100%" stop-color="#030912"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-android-web)"/>
  <circle cx="220" cy="170" r="280" fill="#38bdf8" opacity="0.25" filter="url(#glow-android-web)"/>
  <circle cx="1020" cy="460" r="290" fill="#34d399" opacity="0.24" filter="url(#glow-android-web)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="88" y="67" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">PLATFORM DECISION</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">Android App vs Web Application</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Cost, Maintenance, Frictionless Onboarding &amp; Hardware Sensor Access Compared</text>

  <!-- Left Side: Native Android -->
  <g transform="translate(70, 205)">
    <rect width="490" height="385" rx="20" fill="#062e20" stroke="#10b981" stroke-width="2" filter="url(#soft-shadow-android-web)"/>
    <rect x="30" y="25" width="200" height="32" rx="10" fill="#047857"/>
    <text x="45" y="46" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="13" font-weight="800">📱 NATIVE ANDROID APP</text>
    <text x="30" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Google Play Ecosystem</text>
    
    <rect x="30" y="115" width="430" height="42" rx="8" fill="#064e3b"/>
    <text x="45" y="141" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">⚡ Deep hardware access: Bluetooth, NFC, Background GPS</text>
    <rect x="30" y="165" width="430" height="42" rx="8" fill="#064e3b"/>
    <text x="45" y="191" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">💰 High cost: 2 distinct codebases (Kotlin + iOS Swift)</text>
    <rect x="30" y="215" width="430" height="42" rx="8" fill="#064e3b"/>
    <text x="45" y="241" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">🛑 High user friction: 50MB download + Play Store review</text>
    <rect x="30" y="265" width="430" height="42" rx="8" fill="#064e3b"/>
    <text x="45" y="291" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">💸 15%–30% Google Play in-app purchase cut</text>
    
    <rect x="30" y="320" width="220" height="42" rx="10" fill="#047857"/>
    <text x="45" y="346" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Best for: Hardware &amp; Games</text>
  </g>

  <!-- VS Badge -->
  <g transform="translate(565, 370)">
    <circle cx="35" cy="35" r="35" fill="#f59e0b" filter="url(#glow-android-web)"/>
    <text x="21" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="900">VS</text>
  </g>

  <!-- Right Side: Responsive Web App / PWA -->
  <g transform="translate(640, 205)">
    <rect width="490" height="385" rx="20" fill="#091d33" stroke="#0284c7" stroke-width="2" filter="url(#soft-shadow-android-web)"/>
    <rect x="30" y="25" width="220" height="32" rx="10" fill="#0369a1"/>
    <text x="45" y="46" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="13" font-weight="800">🌐 RESPONSIVE WEB APP / PWA</text>
    <text x="30" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Universal Browser Reach</text>
    
    <rect x="30" y="115" width="430" height="42" rx="8" fill="#075985"/>
    <text x="45" y="141" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">✔ Zero install friction: Instant link click opens full app</text>
    <rect x="30" y="165" width="430" height="42" rx="8" fill="#075985"/>
    <text x="45" y="191" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">✔ Single unified codebase: Runs on Android, iOS &amp; Desktop</text>
    <rect x="30" y="215" width="430" height="42" rx="8" fill="#075985"/>
    <text x="45" y="241" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">✔ Direct billing: Zero 30% app store cut with Stripe/Razorpay</text>
    <rect x="30" y="265" width="430" height="42" rx="8" fill="#075985"/>
    <text x="45" y="291" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">✔ Push notifications &amp; offline caching via Service Workers</text>

    
  <g transform="translate(360, 255) scale(0.95)">
    <ellipse cx="60" cy="118" rx="38" ry="12" fill="#38bdf8" opacity="0.35"/>
    <ellipse cx="60" cy="118" rx="20" ry="6" fill="#ffffff" opacity="0.75"/>
    <rect x="25" y="42" width="70" height="66" rx="22" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <rect x="33" y="50" width="54" height="42" rx="14" fill="#0f172a"/>
    <circle cx="60" cy="71" r="10" fill="#38bdf8"/>
    <circle cx="60" cy="71" r="4" fill="#ffffff"/>
    <rect x="18" y="6" width="84" height="46" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <rect x="26" y="14" width="68" height="28" rx="12" fill="#090d16" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="44" cy="27" rx="8" ry="6" fill="#38bdf8"/>
    <circle cx="46" cy="25" r="2.5" fill="#ffffff"/>
    <ellipse cx="76" cy="27" rx="8" ry="6" fill="#38bdf8"/>
    <circle cx="78" cy="25" r="2.5" fill="#ffffff"/>
    <line x1="60" y1="6" x2="60" y2="-4" stroke="#64748b" stroke-width="3"/>
    <circle cx="60" cy="-6" r="5" fill="#38bdf8"/>
    <rect x="6" y="55" width="14" height="32" rx="7" fill="#334155"/>
    <rect x="100" y="55" width="14" height="32" rx="7" fill="#334155"/>
  </g>

    <rect x="30" y="320" width="240" height="42" rx="10" fill="#0369a1"/>
    <text x="45" y="346" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Best for: SaaS, B2B &amp; Portals</text>
  </g>
</svg>
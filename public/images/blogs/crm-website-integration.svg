<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-crm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-crm" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-crm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="acc-crm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-crm)"/>
  <circle cx="200" cy="180" r="280" fill="#f97316" opacity="0.28" filter="url(#glow-crm)"/>
  <circle cx="1020" cy="450" r="300" fill="#3b82f6" opacity="0.25" filter="url(#glow-crm)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>


  <!-- Header -->
  <rect x="70" y="45" width="310" height="34" rx="17" fill="#7c2d12" stroke="#f97316" stroke-width="1.5"/>
  <text x="88" y="67" fill="#fdba74" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">AUTOMATED SALES PIPELINE</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.8">Website to CRM Integration Architecture</text>
  <text x="70" y="160" fill="#fdba74" font-family="system-ui, sans-serif" font-size="16">Inbound Lead Capture, Webhook Validation, Idempotent Queues &amp; Instant Sales Alerts</text>

  <!-- Pipeline Stage with Vector AI Bot -->
  <g transform="translate(70, 200)">
    <!-- 5 Steps in Pipeline -->
    <!-- Step 1: Web Form -->
    <g transform="translate(0, 0)">
      <rect width="185" height="360" rx="18" fill="#1c1917" stroke="#44403c" stroke-width="2" filter="url(#soft-shadow-crm)"/>
      <circle cx="92" cy="45" r="25" fill="#292524" stroke="#38bdf8" stroke-width="2"/>
      <text x="92" y="52" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">📝</text>
      <text x="92" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="900" text-anchor="middle">1. Web Form</text>
      <text x="92" y="118" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Inbound Capture</text>
      <line x1="20" y1="135" x2="165" y2="135" stroke="#292524"/>
      <text x="92" y="165" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Client validation</text>
      <text x="92" y="195" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">UTM Tracking tags</text>
      <text x="92" y="225" fill="#d6d3d1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Turnstile bot shield</text>
      <rect x="20" y="300" width="145" height="30" rx="8" fill="#292524"/>
      <text x="92" y="320" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">POST /api/leads</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 190 180 L 215 180" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>

    <!-- Step 2: Edge API Gateway -->
    <g transform="translate(220, 0)">
      <rect width="185" height="360" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" filter="url(#soft-shadow-crm)"/>
      <circle cx="92" cy="45" r="25" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
      <text x="92" y="52" fill="#818cf8" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">⚡</text>
      <text x="92" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="900" text-anchor="middle">2. API Gateway</text>
      <text x="92" y="118" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Edge Runtime</text>
      <line x1="20" y1="135" x2="165" y2="135" stroke="#312e81"/>
      <text x="92" y="165" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Zod schema verify</text>
      <text x="92" y="195" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Rate limit throttle</text>
      <text x="92" y="225" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Idempotent UUID</text>
      <rect x="20" y="300" width="145" height="30" rx="8" fill="#312e81"/>
      <text x="92" y="320" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Status 200 OK</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 410 180 L 435 180" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>

    <!-- Step 3: Resilient Queue (With Mascot AI Robot) -->
    <g transform="translate(440, 0)">
      <rect width="185" height="360" rx="18" fill="#0f172a" stroke="#f97316" stroke-width="2.5" filter="url(#soft-shadow-crm)"/>
      <circle cx="92" cy="45" r="25" fill="#7c2d12" stroke="#f97316" stroke-width="2"/>
      <text x="92" y="52" fill="#fdba74" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">🤖</text>
      <text x="92" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="900" text-anchor="middle">3. AI Queue Bot</text>
      <text x="92" y="118" fill="#fdba74" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">BullMQ / Redis</text>
      <line x1="20" y1="135" x2="165" y2="135" stroke="#1e293b"/>
      <text x="92" y="165" fill="#fdba74" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Zero lost leads</text>
      <text x="92" y="195" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Exponential retry</text>
      <text x="92" y="225" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">5x auto backoff</text>
      <rect x="20" y="300" width="145" height="30" rx="8" fill="#7c2d12"/>
      <text x="92" y="320" fill="#fdba74" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Fault Tolerant</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 630 180 L 655 180" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>

    <!-- Step 4: CRM Ingestion -->
    <g transform="translate(660, 0)">
      <rect width="185" height="360" rx="18" fill="#1e1b4b" stroke="#38bdf8" stroke-width="2" filter="url(#soft-shadow-crm)"/>
      <circle cx="92" cy="45" r="25" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
      <text x="92" y="52" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">🎯</text>
      <text x="92" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="900" text-anchor="middle">4. CRM Sync</text>
      <text x="92" y="118" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">HubSpot / Salesforce</text>
      <line x1="20" y1="135" x2="165" y2="135" stroke="#1e293b"/>
      <text x="92" y="165" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Auto-enrich data</text>
      <text x="92" y="195" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Deal stage update</text>
      <text x="92" y="225" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Rep assignment</text>
      <rect x="20" y="300" width="145" height="30" rx="8" fill="#0c4a6e"/>
      <text x="92" y="320" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Deal Created</text>
    </g>

    <!-- Arrow 4 -->
    <path d="M 850 180 L 875 180" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>

    <!-- Step 5: Sales Action & Conversion -->
    <g transform="translate(880, 0)">
      <rect width="180" height="360" rx="18" fill="#042f2e" stroke="#10b981" stroke-width="2" filter="url(#soft-shadow-crm)"/>
      <circle cx="90" cy="45" r="25" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
      <text x="90" y="52" fill="#34d399" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">🚀</text>
      <text x="90" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="900" text-anchor="middle">5. Instant Alert</text>
      <text x="90" y="118" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">&lt; 60s Response</text>
      <line x1="20" y1="135" x2="160" y2="135" stroke="#134e4a"/>
      <text x="90" y="165" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Slack/SMS alert</text>
      <text x="90" y="195" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">WhatsApp follow-up</text>
      <text x="90" y="225" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Calendar link sent</text>
      <rect x="20" y="300" width="140" height="30" rx="8" fill="#065f46"/>
      <text x="90" y="320" fill="#34d399" font-family="monospace" font-size="11" font-weight="900" text-anchor="middle">Lead Converted</text>
    </g>
  </g>
</svg>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-pay-gate" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-pay-gate" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-pay-gate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071f1a"/>
      <stop offset="50%" stop-color="#0d362d"/>
      <stop offset="100%" stop-color="#030d0a"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-pay-gate)"/>
  <circle cx="220" cy="170" r="280" fill="#10b981" opacity="0.25" filter="url(#glow-pay-gate)"/>
  <circle cx="1020" cy="460" r="290" fill="#f59e0b" opacity="0.24" filter="url(#glow-pay-gate)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
  <text x="88" y="67" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">FINTECH INTEGRATION</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">Payment Gateway Integration</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">PCI-DSS Compliant Checkout, Webhook Orchestration &amp; Multi-Currency Routing</text>

  <!-- Flow Arena -->
  <g transform="translate(70, 205)">
    <!-- Left: Checkout Initiation -->
    <rect x="0" y="20" width="310" height="340" rx="18" fill="#08241d" stroke="#10b981" stroke-width="1.8" filter="url(#soft-shadow-pay-gate)"/>
    <text x="25" y="55" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="800">1. CLIENT CHECKOUT</text>
    <text x="25" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Order Creation</text>
    <rect x="25" y="110" width="260" height="46" rx="8" fill="#064e3b" fill-opacity="0.4"/>
    <text x="40" y="138" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13">Card, UPI, NetBanking, ApplePay</text>
    <rect x="25" y="168" width="260" height="46" rx="8" fill="#064e3b" fill-opacity="0.4"/>
    <text x="40" y="196" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">Tokenized Card Vault (PCI-DSS)</text>
    <rect x="25" y="226" width="260" height="46" rx="8" fill="#064e3b" fill-opacity="0.4"/>
    <text x="40" y="254" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13">Instant Order Token Request</text>

    <!-- Connector 1 -->
    <path d="M 310 190 L 375 190" stroke="#10b981" stroke-width="3" stroke-dasharray="6 4"/>

    <!-- Middle: Payment Hub & Webhook Handler -->
    <rect x="375" y="0" width="340" height="385" rx="20" fill="#2d1c07" stroke="#f59e0b" stroke-width="2" filter="url(#soft-shadow-pay-gate)"/>
    <rect x="400" y="25" width="160" height="28" rx="8" fill="#b45309"/>
    <text x="410" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">GATEWAY ROUTER</text>
    <text x="400" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="900">Razorpay / Stripe Hub</text>
    
    <rect x="400" y="110" width="290" height="42" rx="8" fill="#78350f"/>
    <text x="415" y="136" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="12">✔ 3D Secure 2.0 Auth Validation</text>
    <rect x="400" y="160" width="290" height="42" rx="8" fill="#78350f"/>
    <text x="415" y="186" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="12">✔ Cryptographic Webhook Signing</text>
    
    
  <g transform="translate(490, 220) scale(0.85)">
    <ellipse cx="60" cy="118" rx="38" ry="12" fill="#f59e0b" opacity="0.35"/>
    <ellipse cx="60" cy="118" rx="20" ry="6" fill="#ffffff" opacity="0.75"/>
    <rect x="25" y="42" width="70" height="66" rx="22" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <rect x="33" y="50" width="54" height="42" rx="14" fill="#0f172a"/>
    <circle cx="60" cy="71" r="10" fill="#f59e0b"/>
    <circle cx="60" cy="71" r="4" fill="#ffffff"/>
    <rect x="18" y="6" width="84" height="46" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <rect x="26" y="14" width="68" height="28" rx="12" fill="#090d16" stroke="#f59e0b" stroke-width="1.5"/>
    <ellipse cx="44" cy="27" rx="8" ry="6" fill="#f59e0b"/>
    <circle cx="46" cy="25" r="2.5" fill="#ffffff"/>
    <ellipse cx="76" cy="27" rx="8" ry="6" fill="#f59e0b"/>
    <circle cx="78" cy="25" r="2.5" fill="#ffffff"/>
    <line x1="60" y1="6" x2="60" y2="-4" stroke="#64748b" stroke-width="3"/>
    <circle cx="60" cy="-6" r="5" fill="#f59e0b"/>
    <rect x="6" y="55" width="14" height="32" rx="7" fill="#334155"/>
    <rect x="100" y="55" width="14" height="32" rx="7" fill="#334155"/>
  </g>


    <!-- Connector 2 -->
    <path d="M 715 190 L 780 190" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 4"/>

    <!-- Right: Fulfillment & Accounting -->
    <rect x="780" y="20" width="280" height="340" rx="18" fill="#08241d" stroke="#10b981" stroke-width="1.8" filter="url(#soft-shadow-pay-gate)"/>
    <text x="805" y="55" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="800">3. FULFILLMENT</text>
    <text x="805" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Order Activated</text>
    <rect x="805" y="110" width="230" height="46" rx="8" fill="#064e3b" fill-opacity="0.4"/>
    <text x="820" y="138" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13">Invoice &amp; Tax Calculation</text>
    <rect x="805" y="168" width="230" height="46" rx="8" fill="#064e3b" fill-opacity="0.4"/>
    <text x="820" y="196" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13">Digital Delivery Trigger</text>
    <rect x="805" y="226" width="230" height="46" rx="8" fill="#064e3b" fill-opacity="0.4"/>
    <text x="820" y="254" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="13">Idempotent DB Ledger</text>
    <rect x="805" y="290" width="230" height="40" rx="10" fill="#047857"/>
    <text x="835" y="315" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">100% Zero Leakage</text>
  </g>
</svg>
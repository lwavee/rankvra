    <linearGradient id="bg-tech-chk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#020c1b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#bg-tech-chk)"/>
  <circle cx="230" cy="170" r="270" fill="#64ffda" opacity="0.16" filter="url(#glow-tech-chk)"/>
  <circle cx="1020" cy="460" r="280" fill="#38bdf8" opacity="0.22" filter="url(#glow-tech-chk)"/>


      <text x="0" y="40" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ INP &lt; 200ms main-thread tuning</text>
      <text x="0" y="65" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ CLS &lt; 0.1 layout shift stability</text>
      <text x="0" y="90" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Server TTFB &lt; 800ms response</text>
      <text x="0" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Next-gen AVIF/WebP images</text>

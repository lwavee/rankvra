      <text x="0" y="65" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Mobile-first viewport &amp; taps</text>
      <text x="0" y="90" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ HTTPS, TLS 1.3 &amp; HSTS security</text>
      <text x="0" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">✓ Search Console coverage sync</text>
    </g>

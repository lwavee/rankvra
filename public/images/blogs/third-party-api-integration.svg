<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-third-api" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-third-api" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-third-api" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081729"/>
      <stop offset="50%" stop-color="#0d2b4a"/>
      <stop offset="100%" stop-color="#030a14"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-third-api)"/>
  <circle cx="220" cy="170" r="280" fill="#0284c7" opacity="0.25" filter="url(#glow-third-api)"/>
  <circle cx="1020" cy="460" r="290" fill="#8b5cf6" opacity="0.24" filter="url(#glow-third-api)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="88" y="67" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">SYSTEM ARCHITECTURE</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">Third-Party API Integration</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Resilient Microservices, Webhook Verification, Token Refresh &amp; Circuit Breakers</text>

  <!-- 4 Stage API Resiliency Flow -->
  <g transform="translate(70, 205)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="250" height="385" rx="18" fill="#0a1d33" stroke="#0284c7" stroke-width="1.8" filter="url(#soft-shadow-third-api)"/>
    <circle cx="45" cy="45" r="20" fill="#0369a1"/>
    <text x="36" y="52" fill="#ffffff" font-size="16">🔑</text>
    <text x="25" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Auth Rotation</text>
    <text x="25" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">OAuth2 refresh tokens auto-renewed in Redis before expiry.</text>
    <rect x="25" y="195" width="200" height="40" rx="8" fill="#0c4a6e"/>
    <text x="35" y="220" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Zero Auth Outage</text>

    <!-- Stage 2 -->
    <rect x="270" y="0" width="250" height="385" rx="18" fill="#1b1038" stroke="#8b5cf6" stroke-width="1.8" filter="url(#soft-shadow-third-api)"/>
    <circle cx="315" cy="45" r="20" fill="#6d28d9"/>
    <text x="306" y="52" fill="#ffffff" font-size="16">⚡</text>
    <text x="295" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Circuit Breaker</text>
    <text x="295" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Fails gracefully to cached fallback if third-party server stumbles.</text>
    <rect x="295" y="195" width="200" height="40" rx="8" fill="#4c1d95"/>
    <text x="305" y="220" fill="#ddd6fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Resilient Fallbacks</text>

    <!-- Stage 3 -->
    <rect x="540" y="0" width="250" height="385" rx="18" fill="#2d1307" stroke="#f59e0b" stroke-width="1.8" filter="url(#soft-shadow-third-api)"/>
    <circle cx="585" cy="45" r="20" fill="#b45309"/>
    <text x="576" y="52" fill="#ffffff" font-size="16">🔄</text>
    <text x="565" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Idempotency</text>
    <text x="565" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Unique idempotency keys prevent duplicate billing or duplicate leads.</text>
    <rect x="565" y="195" width="200" height="40" rx="8" fill="#78350f"/>
    <text x="575" y="220" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">100% Exact Once</text>

    <!-- Stage 4: API Bot Mascot -->
    <rect x="810" y="0" width="250" height="385" rx="18" fill="#08281a" stroke="#10b981" stroke-width="1.8" filter="url(#soft-shadow-third-api)"/>
    <circle cx="855" cy="45" r="20" fill="#047857"/>
    <text x="846" y="52" fill="#ffffff" font-size="16">🤖</text>
    <text x="835" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Webhook Bot</text>
    <text x="835" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Cryptographic HMAC signature validation with dead-letter queue.</text>
    
  <g transform="translate(870, 185) scale(0.95)">
    <ellipse cx="60" cy="118" rx="38" ry="12" fill="#10b981" opacity="0.35"/>
    <ellipse cx="60" cy="118" rx="20" ry="6" fill="#ffffff" opacity="0.75"/>
    <rect x="25" y="42" width="70" height="66" rx="22" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <rect x="33" y="50" width="54" height="42" rx="14" fill="#0f172a"/>
    <circle cx="60" cy="71" r="10" fill="#10b981"/>
    <circle cx="60" cy="71" r="4" fill="#ffffff"/>
    <rect x="18" y="6" width="84" height="46" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <rect x="26" y="14" width="68" height="28" rx="12" fill="#090d16" stroke="#10b981" stroke-width="1.5"/>
    <ellipse cx="44" cy="27" rx="8" ry="6" fill="#10b981"/>
    <circle cx="46" cy="25" r="2.5" fill="#ffffff"/>
    <ellipse cx="76" cy="27" rx="8" ry="6" fill="#10b981"/>
    <circle cx="78" cy="25" r="2.5" fill="#ffffff"/>
    <line x1="60" y1="6" x2="60" y2="-4" stroke="#64748b" stroke-width="3"/>
    <circle cx="60" cy="-6" r="5" fill="#10b981"/>
    <rect x="6" y="55" width="14" height="32" rx="7" fill="#334155"/>
    <rect x="100" y="55" width="14" height="32" rx="7" fill="#334155"/>
  </g>

    <rect x="835" y="325" width="200" height="36" rx="8" fill="#047857"/>
    <text x="855" y="348" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">HMAC-SHA256 Signed</text>
  </g>
</svg>
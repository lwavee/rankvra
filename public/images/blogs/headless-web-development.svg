<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-headless" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-headless" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-headless" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="acc-headless" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glass-headless" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-headless)"/>
  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="280" fill="#06b6d4" opacity="0.28" filter="url(#glow-headless)"/>
  <circle cx="1020" cy="450" r="300" fill="#ec4899" opacity="0.25" filter="url(#glow-headless)"/>
  <!-- Modern Tech Grid Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>


  <!-- Header -->
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="88" y="67" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">DECOUPLED ARCHITECTURE</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.8">Headless Web Development Architecture</text>
  <text x="70" y="160" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="16">Decoupling Frontends from Backend CMS &amp; E-Commerce Engines via Structured APIs</text>

  <!-- Main Visual Showcase -->
  <g transform="translate(70, 195)">
    <!-- THE HEAD: Floating Holographic Screen -->
    <g transform="translate(0, 0)">
      <rect width="320" height="380" rx="22" fill="#082f49" stroke="#06b6d4" stroke-width="2" filter="url(#soft-shadow-headless)"/>
      <rect x="25" y="25" width="165" height="30" rx="10" fill="#0c4a6e"/>
      <text x="35" y="45" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="900">THE HEAD (FRONTEND)</text>
      <text x="25" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900">Omnichannel Clients</text>
      <text x="25" y="115" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="13">Ultra-fast Next.js Edge UI</text>
      
      <line x1="25" y1="135" x2="295" y2="135" stroke="#164e63"/>
      
      <rect x="25" y="150" width="270" height="50" rx="10" fill="#0f172a" stroke="#0284c7"/>
      <text x="40" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">⚡ Next.js / React Web App</text>

      <rect x="25" y="215" width="270" height="50" rx="10" fill="#0f172a" stroke="#0284c7"/>
      <text x="40" y="245" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">📱 Mobile PWA (iOS / Android)</text>

      <rect x="25" y="280" width="270" height="50" rx="10" fill="#0f172a" stroke="#0284c7"/>
      <text x="40" y="310" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">🖥️ Smart Display / Kiosk</text>

      <text x="160" y="355" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">&lt; 30ms Time to First Byte</text>
    </g>

    <!-- MIDDLE: Cute AI Robot Mascot Demonstrating API Data Laser Stream -->
    <g transform="translate(345, 30)">
      <!-- Pulsing Data Highway Beam -->
      <path d="M 0 160 C 90 130, 90 190, 180 160" fill="none" stroke="url(#acc-headless)" stroke-width="8" stroke-linecap="round"/>
      <path d="M 0 160 C 90 130, 90 190, 180 160" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 8"/>
      
      <!-- AI Bot Floating on Anti-Gravity Pad -->
      <ellipse cx="90" cy="290" rx="55" ry="12" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="90" cy="270" r="18" fill="#38bdf8" opacity="0.3" filter="url(#glow-headless)"/>

      <!-- Robot Body -->
      <rect x="65" y="170" width="50" height="55" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <rect x="75" y="185" width="30" height="22" rx="6" fill="#0284c7"/>
      <text x="90" y="200" fill="#ffffff" font-family="monospace" font-size="10" font-weight="800" text-anchor="middle">API</text>

      <!-- Robot Head -->
      <rect x="60" y="105" width="60" height="50" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <!-- Glowing Blue Visor with Smiling Eyes -->
      <rect x="68" y="118" width="44" height="22" rx="8" fill="#0369a1"/>
      <ellipse cx="78" cy="129" rx="4" ry="5" fill="#38bdf8"/>
      <ellipse cx="102" cy="129" rx="4" ry="5" fill="#38bdf8"/>
      <!-- Antenna with glowing tip -->
      <line x1="90" y1="105" x2="90" y2="85" stroke="#94a3b8" stroke-width="3"/>
      <circle cx="90" cy="80" r="7" fill="#ec4899" filter="url(#glow-headless)"/>

      <!-- Hand holding holographic sign -->
      <rect x="40" y="45" width="100" height="26" rx="8" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.5"/>
      <text x="90" y="62" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">REST &amp; GraphQL</text>
    </g>

    <!-- THE BODY: Backend CMS & E-Commerce Engines -->
    <g transform="translate(550, 0)">
      <rect width="510" height="380" rx="22" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" filter="url(#soft-shadow-headless)"/>
      <rect x="25" y="25" width="165" height="30" rx="10" fill="#3b0764"/>
      <text x="35" y="45" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="12" font-weight="900">THE BODY (SERVICES)</text>
      <text x="25" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900">Decoupled Engines</text>
      <text x="25" y="115" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="13">Independent content, commerce &amp; data stores</text>

      <line x1="25" y1="135" x2="485" y2="135" stroke="#312e81"/>

      <!-- 4 Service Modules -->
      <rect x="25" y="150" width="220" height="85" rx="12" fill="#0f172a" stroke="#6366f1"/>
      <text x="40" y="180" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Headless CMS</text>
      <text x="40" y="202" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Sanity, Strapi, Contentful</text>
      <text x="40" y="222" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Structured Raw Data</text>

      <rect x="265" y="150" width="220" height="85" rx="12" fill="#0f172a" stroke="#ec4899"/>
      <text x="280" y="180" fill="#f472b6" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Headless Commerce</text>
      <text x="280" y="202" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Shopify Storefront, Medusa</text>
      <text x="280" y="222" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">PCI-Compliant Checkout</text>

      <rect x="25" y="250" width="220" height="85" rx="12" fill="#0f172a" stroke="#10b981"/>
      <text x="40" y="280" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Database &amp; Auth</text>
      <text x="40" y="302" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">PostgreSQL, Supabase, Clerk</text>
      <text x="40" y="322" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Encrypted Cloud Storage</text>

      <rect x="265" y="250" width="220" height="85" rx="12" fill="#0f172a" stroke="#f59e0b"/>
      <text x="280" y="280" fill="#facc15" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Payment &amp; Logistics</text>
      <text x="280" y="302" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Stripe, Shippo, Webhooks</text>
      <text x="280" y="322" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Automated Order Routing</text>

      <text x="255" y="358" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Modularity Without Monolithic Bottlenecks</text>
    </g>
  </g>
</svg>
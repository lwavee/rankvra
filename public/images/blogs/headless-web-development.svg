<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="80"/></filter>
  </defs>
  <rect width="1200" height="630" rx="24" fill="#090d16"/>
  <circle cx="200" cy="180" r="240" fill="#06b6d4" opacity="0.18" filter="url(#glow1)"/>
  <circle cx="1000" cy="460" r="260" fill="#8b5cf6" opacity="0.18" filter="url(#glow2)"/>
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/><line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/><line x1="450" y1="0" x2="450" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="750" y1="0" x2="750" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/><line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>
  <rect x="80" y="55" width="280" height="34" rx="17" fill="#0e7490" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="96" y="77" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">DECOUPLED WEB ARCHITECTURE</text>
  <text x="80" y="135" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">Headless Web Development Architecture</text>
  <text x="80" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Decoupling Frontend User Experiences from Backend Content &amp; Commerce Engines</text>
  
  <g transform="translate(80, 220)">
    <!-- Frontend Layer -->
    <g transform="translate(0, 0)">
      <rect width="280" height="330" rx="16" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
      <rect x="20" y="20" width="130" height="26" rx="6" fill="#164e63"/>
      <text x="32" y="38" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">THE HEAD (FRONTEND)</text>
      <text x="20" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Omnichannel Clients</text>
      <text x="20" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">High-speed user interfaces</text>
      <line x1="20" y1="125" x2="260" y2="125" stroke="#1e293b"/>
      <rect x="20" y="140" width="240" height="42" rx="8" fill="#1e293b"/>
      <text x="35" y="166" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">⚡ Next.js / React Web App</text>
      <rect x="20" y="195" width="240" height="42" rx="8" fill="#1e293b"/>
      <text x="35" y="221" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">📱 Mobile App (iOS / Android)</text>
      <rect x="20" y="250" width="240" height="42" rx="8" fill="#1e293b"/>
      <text x="35" y="276" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🖥️ Smart Kiosk / IoT Display</text>
      <text x="140" y="315" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Ultra-Fast Edge CDN Delivery</text>
    </g>

    <!-- Connector: API Bridge -->
    <g transform="translate(310, 0)">
      <rect width="210" height="330" rx="16" fill="#0f172a" stroke="#64748b" stroke-dasharray="4 4"/>
      <text x="105" y="45" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">API CONTRACT LAYER</text>
      <circle cx="105" cy="115" r="30" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="105" y="122" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">⇄</text>
      <text x="105" y="170" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">GraphQL &amp; REST</text>
      <text x="105" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Type-Safe JSON</text>
      <line x1="30" y1="220" x2="180" y2="220" stroke="#1e293b"/>
      <text x="105" y="245" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Webhook Sync</text>
      <text x="105" y="270" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Edge Revalidation</text>
      <text x="105" y="295" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Token Authentication</text>
    </g>

    <!-- Backend Headless Engines -->
    <g transform="translate(550, 0)">
      <rect width="490" height="330" rx="16" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
      <rect x="20" y="20" width="140" height="26" rx="6" fill="#3b0764"/>
      <text x="32" y="38" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700">THE BODY (SERVICES)</text>
      <text x="20" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Decoupled Business Services</text>
      <text x="20" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Independent content, commerce &amp; database platforms</text>
      <line x1="20" y1="125" x2="470" y2="125" stroke="#1e293b"/>
      
      <!-- Service 1 -->
      <rect x="20" y="140" width="215" height="70" rx="8" fill="#1e293b"/>
      <text x="35" y="165" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Headless CMS</text>
      <text x="35" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Sanity, Strapi, Contentful</text>

      <!-- Service 2 -->
      <rect x="250" y="140" width="220" height="70" rx="8" fill="#1e293b"/>
      <text x="265" y="165" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Headless Commerce</text>
      <text x="265" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Shopify Storefront, Medusa</text>

      <!-- Service 3 -->
      <rect x="20" y="225" width="215" height="70" rx="8" fill="#1e293b"/>
      <text x="35" y="250" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Database &amp; Auth</text>
      <text x="35" y="275" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">PostgreSQL, Supabase, Clerk</text>

      <!-- Service 4 -->
      <rect x="250" y="225" width="220" height="70" rx="8" fill="#1e293b"/>
      <text x="265" y="250" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Payment &amp; Logistics</text>
      <text x="265" y="275" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Stripe, Shippo, Webhooks</text>
      <text x="245" y="315" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Modularity Without Monolithic Bottlenecks</text>
    </g>
  </g>
</svg>
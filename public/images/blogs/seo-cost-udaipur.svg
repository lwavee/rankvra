<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" rx="24" fill="#0f172a"/>
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <defs>
    <filter id="b1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="b2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>
  <!-- Glow Accents -->
  <circle cx="150" cy="180" r="200" fill="#059669" opacity="0.18" filter="url(#b1)"/>
  <circle cx="950" cy="400" r="220" fill="#4f46e5" opacity="0.18" filter="url(#b2)"/>

  <!-- Badge -->
  <rect x="80" y="70" width="180" height="38" rx="19" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="100" y="94" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">PRICING INTELLIGENCE</text>

  <!-- Title & Subtitle -->
  <text x="80" y="160" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">How Much Does SEO</text>
  <text x="80" y="215" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Cost in Udaipur?</text>
  <text x="80" y="265" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">A practical breakdown of investment drivers, deliverable tiers &amp; the hidden risks of cheap SEO.</text>

  <!-- Pricing Comparison Cards -->
  <!-- Card 1: Cheap SEO Trap -->
  <g transform="translate(80, 310)">
    <rect width="320" height="240" rx="18" fill="#1e293b" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="24" y="45" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">₹3,000 – ₹7,000 / mo</text>
    <text x="24" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">The "Cheap SEO" Trap</text>
    <text x="24" y="115" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Automated bot backlinks</text>
    <text x="24" y="140" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; AI spun thin content</text>
    <text x="24" y="165" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Zero technical or code fixes</text>
    <rect x="24" y="190" width="120" height="24" rx="6" fill="#ef4444" opacity="0.2"/>
    <text x="34" y="206" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">HIGH PENALTY RISK</text>
  </g>

  <!-- Card 2: Local Growth -->
  <g transform="translate(430, 310)">
    <rect width="320" height="240" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="24" y="45" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">₹15,000 – ₹30,000 / mo</text>
    <text x="24" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">Local Udaipur SEO</text>
    <text x="24" y="115" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Maps 3-Pack optimization</text>
    <text x="24" y="140" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Local citation clean-up</text>
    <text x="24" y="165" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Mobile speed &amp; schema tags</text>
    <rect x="24" y="190" width="130" height="24" rx="6" fill="#10b981" opacity="0.2"/>
    <text x="34" y="206" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">TARGETED LOCAL ROI</text>
  </g>

  <!-- Card 3: Competitive & National -->
  <g transform="translate(780, 310)">
    <rect width="340" height="240" rx="18" fill="#1e293b" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="24" y="45" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">₹35,000 – ₹70,000+ / mo</text>
    <text x="24" y="80" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">National &amp; Export B2B</text>
    <text x="24" y="115" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Full technical re-architecting</text>
    <text x="24" y="140" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Deep topical authority clusters</text>
    <text x="24" y="165" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Multi-region buyer funnels</text>
    <rect x="24" y="190" width="130" height="24" rx="6" fill="#4f46e5" opacity="0.2"/>
    <text x="34" y="206" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">SCALABLE PIPELINE</text>
  </g>

  <!-- RankVRA Signature -->
  <text x="1120" y="585" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="end">RankVRA Research &#8226; Udaipur</text>
</svg>

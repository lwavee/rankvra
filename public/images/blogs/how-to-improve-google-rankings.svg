<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-seo-rank" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow-card" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-seo-rank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09152b"/>
      <stop offset="50%" stop-color="#0e1e40"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" rx="28" fill="url(#bg-seo-rank)"/>
  <circle cx="200" cy="160" r="260" fill="#38bdf8" opacity="0.22" filter="url(#glow-seo-rank)"/>
  <circle cx="1020" cy="480" r="280" fill="#6366f1" opacity="0.25" filter="url(#glow-seo-rank)"/>

  <!-- Grid Blueprint Overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- Header Badge & Title -->
  <rect x="70" y="45" width="260" height="34" rx="17" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="88" y="67" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">COMPLETE SEARCH GUIDE</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">How to Improve Your Google Rankings</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="17">Intent Architecture, Technical Crawlability, Semantic Authority &amp; Algorithmic Growth</text>

  <!-- 3 Strategic Pillars Cards -->
  <g transform="translate(70, 205)">
    <!-- Pillar 1 -->
    <rect x="0" y="0" width="320" height="385" rx="18" fill="#0a1d33" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow-card)"/>
    <circle cx="45" cy="45" r="20" fill="#0369a1"/>
    <text x="36" y="52" fill="#ffffff" font-size="16">⚡</text>
    <text x="25" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">1. Technical Foundation</text>
    <text x="25" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Crawl budget, Core Web Vitals (LCP &lt; 2.5s, INP &lt; 200ms), Next.js SSR, and clean canonical graphs.</text>
    <rect x="25" y="210" width="270" height="42" rx="8" fill="#0c4a6e"/>
    <text x="40" y="236" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700">100% Indexation Health</text>
    <rect x="25" y="265" width="270" height="36" rx="8" fill="#062d47"/>
    <text x="40" y="288" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Schema.org JSON-LD Validated</text>

    <!-- Pillar 2 -->
    <rect x="360" y="0" width="320" height="385" rx="18" fill="#1b1038" stroke="#8b5cf6" stroke-width="1.8" filter="url(#shadow-card)"/>
    <circle cx="405" cy="45" r="20" fill="#6d28d9"/>
    <text x="396" y="52" fill="#ffffff" font-size="16">🧠</text>
    <text x="385" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">2. Semantic Authority</text>
    <text x="385" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Topic cluster pillars, search intent mapping, entity relationships, and comprehensive E-E-A-T depth.</text>
    <rect x="385" y="210" width="270" height="42" rx="8" fill="#4c1d95"/>
    <text x="400" y="236" fill="#ddd6fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Helpful Content Compliant</text>
    <rect x="385" y="265" width="270" height="36" rx="8" fill="#2e1065"/>
    <text x="400" y="288" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Contextual Topic Clustering</text>

    <!-- Pillar 3 -->
    <rect x="720" y="0" width="320" height="385" rx="18" fill="#062e24" stroke="#10b981" stroke-width="1.8" filter="url(#shadow-card)"/>
    <circle cx="765" cy="45" r="20" fill="#047857"/>
    <text x="756" y="52" fill="#ffffff" font-size="16">📈</text>
    <text x="745" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">3. High-Intent Backlinks</text>
    <text x="745" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Editorial citations, industry digital PR, verified local citations, and conversion-focused CRO funnels.</text>
    <rect x="745" y="210" width="270" height="42" rx="8" fill="#065f46"/>
    <text x="760" y="236" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Zero Spam PBN Links</text>
    <rect x="745" y="265" width="270" height="36" rx="8" fill="#022c22"/>
    <text x="760" y="288" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Pipeline Revenue Attribution</text>
  </g>
</svg>

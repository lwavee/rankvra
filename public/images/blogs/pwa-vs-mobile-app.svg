<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="80"/></filter>
  </defs>
  <rect width="1200" height="630" rx="24" fill="#090d16"/>
  <circle cx="180" cy="160" r="240" fill="#06b6d4" opacity="0.18" filter="url(#glow1)"/>
  <circle cx="1040" cy="460" r="260" fill="#a855f7" opacity="0.16" filter="url(#glow2)"/>
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/><line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/><line x1="450" y1="0" x2="450" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="750" y1="0" x2="750" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/><line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>
  <rect x="80" y="55" width="310" height="34" rx="17" fill="#164e63" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="96" y="77" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CROSS-PLATFORM ENGINEERING STRATEGY</text>
  <text x="80" y="135" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">PWA vs Native Mobile App Comparison</text>
  <text x="80" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Installation Friction, App Store Fees, Push Notifications &amp; Offline Performance</text>

  <g transform="translate(80, 220)">
    <!-- Column 1: Progressive Web App -->
    <g transform="translate(0, 0)">
      <rect width="490" height="340" rx="18" fill="#0f172a" stroke="#06b6d4" stroke-width="1.8"/>
      <rect x="25" y="25" width="130" height="28" rx="6" fill="#164e63"/>
      <text x="40" y="44" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="13" font-weight="700">PROGRESSIVE WEB APP</text>
      <text x="25" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Browser-Installed App</text>
      <text x="25" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Fast, friction-free distribution via standard URL</text>
      <line x1="25" y1="130" x2="465" y2="130" stroke="#1e293b" stroke-width="1.5"/>
      <text x="25" y="160" fill="#34d399" font-family="system-ui, sans-serif" font-size="13">✓ <tspan font-weight="700">Zero App Store Toll:</tspan> 0% commission on digital revenue</text>
      <text x="25" y="190" fill="#34d399" font-family="system-ui, sans-serif" font-size="13">✓ <tspan font-weight="700">Frictionless Install:</tspan> Add to Home Screen in 1 tap, &lt; 2MB</text>
      <text x="25" y="220" fill="#34d399" font-family="system-ui, sans-serif" font-size="13">✓ <tspan font-weight="700">Offline Caching:</tspan> Service Worker cache for instant load</text>
      <text x="25" y="250" fill="#34d399" font-family="system-ui, sans-serif" font-size="13">✓ <tspan font-weight="700">Web Push Notifications:</tspan> Supported on Chrome, Edge &amp; iOS</text>
      <text x="25" y="280" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">✓ <tspan font-weight="700">Single Codebase:</tspan> 1 engineering team maintains web + PWA</text>
      <rect x="25" y="300" width="440" height="25" rx="6" fill="#164e63"/>
      <text x="245" y="317" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Best: B2B Portals, Media, E-commerce, Global Reach</text>
    </g>

    <!-- Column 2: Native Mobile App -->
    <g transform="translate(550, 0)">
      <rect width="490" height="340" rx="18" fill="#0f172a" stroke="#a855f7" stroke-width="1.8"/>
      <rect x="25" y="25" width="150" height="28" rx="6" fill="#3b0764"/>
      <text x="40" y="44" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="13" font-weight="700">NATIVE MOBILE APP</text>
      <text x="25" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">iOS &amp; Android Native</text>
      <text x="25" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Direct binary execution via Apple App Store &amp; Google Play</text>
      <line x1="25" y1="130" x2="465" y2="130" stroke="#1e293b" stroke-width="1.5"/>
      <text x="25" y="160" fill="#34d399" font-family="system-ui, sans-serif" font-size="13">✓ <tspan font-weight="700">Deep Hardware Access:</tspan> Bluetooth, NFC, LiDAR, Geofencing</text>
      <text x="25" y="190" fill="#34d399" font-family="system-ui, sans-serif" font-size="13">✓ <tspan font-weight="700">Ultra-High Frame Rates:</tspan> 120Hz GPU animations &amp; 3D games</text>
      <text x="25" y="220" fill="#f87171" font-family="system-ui, sans-serif" font-size="13">⚠️ <tspan font-weight="700">Store Friction &amp; Review:</tspan> Days of review delay &amp; rejections</text>
      <text x="25" y="250" fill="#f87171" font-family="system-ui, sans-serif" font-size="13">⚠️ <tspan font-weight="700">App Store Tax:</tspan> 15%–30% transaction commission</text>
      <text x="25" y="280" fill="#f87171" font-family="system-ui, sans-serif" font-size="13">⚠️ <tspan font-weight="700">High Overhead:</tspan> 2–3x development &amp; continuous maintenance</text>
      <rect x="25" y="300" width="440" height="25" rx="6" fill="#3b0764"/>
      <text x="245" y="317" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Best: Consumer Gaming, Hardware Accessories, Heavy Sensors</text>
    </g>
  </g>
</svg>
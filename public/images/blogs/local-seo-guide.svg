<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-loc-seo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow-card" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-loc-seo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081b29"/>
      <stop offset="50%" stop-color="#0d2c42"/>
      <stop offset="100%" stop-color="#020d14"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#bg-loc-seo)"/>
  <circle cx="210" cy="170" r="270" fill="#0ea5e9" opacity="0.22" filter="url(#glow-loc-seo)"/>
  <circle cx="1010" cy="460" r="280" fill="#10b981" opacity="0.22" filter="url(#glow-loc-seo)"/>

  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <rect x="70" y="45" width="240" height="34" rx="17" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="88" y="67" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">LOCAL SEARCH PLAYBOOK</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">Local SEO Guide: Get Found on Google</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="17">Google Business Profile, Google Maps 3-Pack, NAP Citations, Reviews &amp; Localized Schema</text>

  <g transform="translate(70, 205)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="320" height="385" rx="18" fill="#0b2438" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow-card)"/>
    <circle cx="45" cy="45" r="20" fill="#0369a1"/>
    <text x="36" y="52" fill="#ffffff" font-size="16">📍</text>
    <text x="25" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Google Business Profile</text>
    <text x="25" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Primary categories, rich service menus, geotagged real photos, weekly updates, and real Q&amp;A curation.</text>
    <rect x="25" y="210" width="270" height="42" rx="8" fill="#073b5c"/>
    <text x="40" y="236" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Google Maps 3-Pack Dominance</text>

    <!-- Card 2 -->
    <rect x="360" y="0" width="320" height="385" rx="18" fill="#06322b" stroke="#10b981" stroke-width="1.8" filter="url(#shadow-card)"/>
    <circle cx="405" cy="45" r="20" fill="#047857"/>
    <text x="396" y="52" fill="#ffffff" font-size="16">⭐</text>
    <text x="385" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Reviews &amp; Trust Velocity</text>
    <text x="385" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Systematic review generation, keyword-rich customer feedback, and professional owner response handling.</text>
    <rect x="385" y="210" width="270" height="42" rx="8" fill="#065f46"/>
    <text x="400" y="236" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Verified Social Proof</text>

    <!-- Card 3 -->
    <rect x="720" y="0" width="320" height="385" rx="18" fill="#1e183a" stroke="#8b5cf6" stroke-width="1.8" filter="url(#shadow-card)"/>
    <circle cx="765" cy="45" r="20" fill="#6d28d9"/>
    <text x="756" y="52" fill="#ffffff" font-size="16">🏷️</text>
    <text x="745" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">NAP &amp; Local Schema</text>
    <text x="745" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Strict NAP consistency across Tier-1 directories, localized landing pages, and JSON-LD LocalBusiness markup.</text>
    <rect x="745" y="210" width="270" height="42" rx="8" fill="#4c1d95"/>
    <text x="760" y="236" fill="#ddd6fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700">100% NAP Consistency</text>
  </g>
</svg>

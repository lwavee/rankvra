<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-backend" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-backend" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-backend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1a2e"/>
      <stop offset="50%" stop-color="#071520"/>
      <stop offset="100%" stop-color="#03080e"/>
    </linearGradient>
    <linearGradient id="glass-backend" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-backend)"/>
  <circle cx="220" cy="170" r="280" fill="#0284c7" opacity="0.25" filter="url(#glow-backend)"/>
  <circle cx="1020" cy="460" r="290" fill="#10b981" opacity="0.24" filter="url(#glow-backend)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="88" y="67" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">SERVER ARCHITECTURE</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">Backend Engineering Blueprint</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Distributed Microservices, Concurrency Control &amp; Database Resilience</text>

  <!-- Grid of 4 Server Modules -->
  <g transform="translate(70, 205)">
    <!-- Module 1 -->
    <rect x="0" y="0" width="330" height="175" rx="16" fill="#0f2238" stroke="#0284c7" stroke-width="1.8" filter="url(#soft-shadow-backend)"/>
    <text x="25" y="38" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="800">MODULE 01</text>
    <text x="25" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">API Gateway &amp; Auth</text>
    <text x="25" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Rate limiting, SSL termination, JWT authentication &amp; telemetry tracing.</text>
    <rect x="25" y="125" width="130" height="26" rx="8" fill="#0369a1"/>
    <text x="38" y="143" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Kong / Envoy</text>

    <!-- Module 2 -->
    <rect x="360" y="0" width="330" height="175" rx="16" fill="#072b22" stroke="#10b981" stroke-width="1.8" filter="url(#soft-shadow-backend)"/>
    <text x="385" y="38" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="800">MODULE 02</text>
    <text x="385" y="68" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Business Logic Engine</text>
    <text x="385" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Event-driven Node.js &amp; Go routines handling checkout &amp; transactional flows.</text>
    <rect x="385" y="125" width="130" height="26" rx="8" fill="#047857"/>
    <text x="398" y="143" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Domain Services</text>

    <!-- Module 3 -->
    <rect x="0" y="200" width="330" height="175" rx="16" fill="#2d153b" stroke="#c084fc" stroke-width="1.8" filter="url(#soft-shadow-backend)"/>
    <text x="25" y="238" fill="#e879f9" font-family="system-ui, sans-serif" font-size="13" font-weight="800">MODULE 03</text>
    <text x="25" y="268" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Message Queue &amp; Cache</text>
    <text x="25" y="298" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Redis pub/sub &amp; RabbitMQ queues for asynchronous job scheduling.</text>
    <rect x="25" y="325" width="130" height="26" rx="8" fill="#6b21a8"/>
    <text x="38" y="343" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Sub-10ms Redis</text>

    <!-- Module 4 -->
    <rect x="360" y="200" width="330" height="175" rx="16" fill="#1b2434" stroke="#f59e0b" stroke-width="1.8" filter="url(#soft-shadow-backend)"/>
    <text x="385" y="238" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="800">MODULE 04</text>
    <text x="385" y="268" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">PostgreSQL Relational DB</text>
    <text x="385" y="298" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">ACID compliance, indexed queries &amp; read-replica load balancing.</text>
    <rect x="385" y="325" width="130" height="26" rx="8" fill="#b45309"/>
    <text x="398" y="343" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ACID Integrity</text>
  </g>

  <!-- Right Visual Stage: Server Bot Mascot -->
  <g transform="translate(790, 205)">
    <rect width="340" height="375" rx="20" fill="#0a1220" stroke="#1e293b" stroke-width="2" filter="url(#soft-shadow-backend)"/>
    <text x="30" y="45" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="800">BACKEND RESILIENCE BOT</text>
    
  <g transform="translate(110, 80) scale(1.25)">
    <!-- Hover Thruster / Ring -->
    <ellipse cx="60" cy="118" rx="38" ry="12" fill="#10b981" opacity="0.35"/>
    <ellipse cx="60" cy="118" rx="20" ry="6" fill="#ffffff" opacity="0.75"/>
    <!-- Bot Body -->
    <rect x="25" y="42" width="70" height="66" rx="22" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <rect x="33" y="50" width="54" height="42" rx="14" fill="#0f172a"/>
    <!-- Core Glow / Heartbeat -->
    <circle cx="60" cy="71" r="10" fill="#10b981"/>
    <circle cx="60" cy="71" r="4" fill="#ffffff"/>
    <!-- Bot Head -->
    <rect x="18" y="6" width="84" height="46" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <!-- Visor -->
    <rect x="26" y="14" width="68" height="28" rx="12" fill="#090d16" stroke="#10b981" stroke-width="1.5"/>
    <!-- Eyes -->
    <ellipse cx="44" cy="27" rx="8" ry="6" fill="#10b981"/>
    <circle cx="46" cy="25" r="2.5" fill="#ffffff"/>
    <ellipse cx="76" cy="27" rx="8" ry="6" fill="#10b981"/>
    <circle cx="78" cy="25" r="2.5" fill="#ffffff"/>
    <!-- Antennas -->
    <line x1="60" y1="6" x2="60" y2="-4" stroke="#64748b" stroke-width="3"/>
    <circle cx="60" cy="-6" r="5" fill="#10b981"/>
    <!-- Little Hands -->
    <rect x="6" y="55" width="14" height="32" rx="7" fill="#334155"/>
    <rect x="100" y="55" width="14" height="32" rx="7" fill="#334155"/>
  </g>

    <!-- Server Status Terminal -->
    <rect x="25" y="240" width="290" height="110" rx="12" fill="#020617" stroke="#0f172a" stroke-width="1.5"/>
    <text x="40" y="268" fill="#34d399" font-family="monospace" font-size="12">● Status: Healthy (99.99%)</text>
    <text x="40" y="292" fill="#38bdf8" font-family="monospace" font-size="12">● RPS: 4,820 req/sec</text>
    <text x="40" y="316" fill="#facc15" font-family="monospace" font-size="12">● Latency: p95 = 24ms</text>
    <text x="40" y="338" fill="#94a3b8" font-family="monospace" font-size="11">● Active Replicas: 8 Nodes</text>
  </g>
</svg>
    <rect x="835" y="325" width="200" height="36" rx="8" fill="#6b21a8"/>
    <text x="850" y="348" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ROAS: 12x Organic</text>

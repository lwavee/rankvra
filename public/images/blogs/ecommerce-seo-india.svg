<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-ecom-seo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-ecom-seo" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-ecom-seo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#281105"/>
      <stop offset="50%" stop-color="#3d1b09"/>
      <stop offset="100%" stop-color="#0d0502"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-ecom-seo)"/>

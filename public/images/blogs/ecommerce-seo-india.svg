    <rect x="810" y="0" width="250" height="385" rx="18" fill="#240c2e" stroke="#c084fc" stroke-width="1.8" filter="url(#soft-shadow-ecom-seo)"/>
    <circle cx="855" cy="45" r="20" fill="#6b21a8"/>
    <text x="846" y="52" fill="#ffffff" font-size="16">📈</text>
    <text x="835" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Organic Revenue</text>
    <text x="835" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">300%+ increase in non-brand search sales across India.</text>
    
  <g transform="translate(870, 185) scale(0.95)">

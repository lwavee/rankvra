<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="60%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c1236"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Neural Net Background Connections -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="150" y1="120" x2="350" y2="280"/>
    <line x1="350" y1="280" x2="200" y2="480"/>
    <line x1="350" y1="280" x2="550" y2="200"/>
    <line x1="550" y1="200" x2="700" y2="350"/>
    <line x1="700" y1="350" x2="900" y2="180"/>
    <line x1="700" y1="350" x2="850" y2="480"/>
    <line x1="900" y1="180" x2="1100" y2="280"/>
    <line x1="850" y1="480" x2="1100" y2="400"/>
  </g>
  <g fill="#818cf8" opacity="0.4">
    <circle cx="150" cy="120" r="4"/>
    <circle cx="350" cy="280" r="6"/>
    <circle cx="200" cy="480" r="4"/>
    <circle cx="550" cy="200" r="5"/>
    <circle cx="700" cy="350" r="7"/>
    <circle cx="900" cy="180" r="5"/>
    <circle cx="850" cy="480" r="4"/>
    <circle cx="1100" cy="280" r="6"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="850" cy="300" r="180" fill="#8b5cf6" opacity="0.15" filter="url(#aiGlow)"/>
  <circle cx="200" cy="200" r="140" fill="#ec4899" opacity="0.1" filter="url(#aiGlow)"/>

  <!-- Left Content -->
  <g transform="translate(80, 110)">
    <!-- Badge -->
    <rect width="210" height="36" rx="18" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="22" cy="18" r="5" fill="#a855f7"/>
    <text x="38" y="23" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">AI SEARCH &amp; SGE SHIFT</text>

    <!-- Title -->
    <text x="0" y="90" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" line-height="1.2">
      <tspan x="0" dy="0">How AI Is Transforming SEO</tspan>
      <tspan x="0" dy="54" fill="url(#aiGrad)">For Small Businesses</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
      Navigating Google AI Overviews, GEO, and human-first authority.
    </text>

    <!-- 3 Key AI Pillars -->
    <g transform="translate(0, 260)">
      <rect width="150" height="38" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="75" y="24" fill="#ec4899" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600">AI Overviews (SGE)</text>

      <rect x="165" width="165" height="38" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="247" y="24" fill="#a855f7" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600">Information Gain Score</text>

      <rect x="345" width="160" height="38" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="425" y="24" fill="#38bdf8" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600">First-Party Data</text>
    </g>

    <!-- Author Attribution -->
    <g transform="translate(0, 360)">
      <text x="0" y="0" fill="#cbd5e1" font-family="sans-serif" font-size="15" font-weight="600">RankVRA AI &amp; Search Advisory</text>
      <text x="0" y="22" fill="#64748b" font-family="sans-serif" font-size="13">By Naveen Panchal • Future of Search Strategy</text>
    </g>
  </g>

  <!-- Right Visual: AI Overview vs Organic Comparison Diagram -->
  <g transform="translate(680, 110)">
    <!-- Diagram Card Base -->
    <rect width="440" height="420" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    
    <!-- Header -->
    <rect width="440" height="48" rx="16" fill="#1e1b4b"/>
    <rect y="30" width="440" height="18" fill="#1e1b4b"/>
    <text x="25" y="32" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Google AI Overview Engine</text>
    <rect x="320" y="14" width="100" height="22" rx="11" fill="#312e81"/>
    <text x="370" y="29" fill="#c7d2fe" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">SGE Model</text>

    <!-- Visual Breakdown Inside Card -->
    <g transform="translate(25, 70)">
      <!-- AI Overview Box -->
      <rect width="390" height="150" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
      
      <g transform="translate(15, 15)">
        <circle cx="10" cy="10" r="10" fill="url(#aiGrad)"/>
        <text x="28" y="15" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="700">Generative AI Summary Box</text>
        <text x="28" y="38" fill="#94a3b8" font-family="sans-serif" font-size="11">Direct synthesis answering user intent instantly...</text>
        
        <!-- Cited Sources Carousel inside SGE -->
        <g transform="translate(0, 55)">
          <text x="0" y="12" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">TOP CITED AUTHORITY SOURCES:</text>
          
          <rect y="22" width="115" height="45" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
          <text x="10" y="42" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="700">RankVRA Data</text>
          <text x="10" y="56" fill="#64748b" font-family="sans-serif" font-size="9">Cited in #1 Spot</text>

          <rect x="125" y="22" width="115" height="45" rx="6" fill="#0f172a" stroke="#334155"/>
          <text x="135" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Case Study #2</text>
          <text x="135" y="56" fill="#64748b" font-family="sans-serif" font-size="9">Field Research</text>

          <rect x="250" y="22" width="110" height="45" rx="6" fill="#0f172a" stroke="#334155"/>
          <text x="260" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Industry Report</text>
          <text x="260" y="56" fill="#64748b" font-family="sans-serif" font-size="9">Primary Data</text>
        </g>
      </g>

      <!-- Why AI Selects Your Content (The Formula) -->
      <g transform="translate(0, 175)">
        <rect width="390" height="135" rx="10" fill="#0b132b" stroke="#334155"/>
        <text x="18" y="26" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">The 2026 AI Search Survival Formula</text>
        
        <g transform="translate(18, 42)">
          <circle cx="6" cy="6" r="3" fill="#10b981"/>
          <text x="18" y="10" fill="#cbd5e1" font-family="sans-serif" font-size="11">Proprietary Case Studies &amp; Local Proof (Zero generic AI fluff)</text>

          <circle cx="6" cy="32" r="3" fill="#38bdf8"/>
          <text x="18" y="36" fill="#cbd5e1" font-family="sans-serif" font-size="11">Structured Schema &amp; Clear Direct Answers for Crawlers</text>

          <circle cx="6" cy="58" r="3" fill="#f59e0b"/>
          <text x="18" y="62" fill="#cbd5e1" font-family="sans-serif" font-size="11">Author Verifiable Real-World Authority (E-E-A-T)</text>
        </g>
      </g>
    </g>
  </g>
</svg>

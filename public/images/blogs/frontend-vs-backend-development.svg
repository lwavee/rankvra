<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-fe-be" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-fe-be" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-fe-be" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#151d38"/>
      <stop offset="100%" stop-color="#050711"/>
    </linearGradient>
    <linearGradient id="glass-fe-be" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-fe-be)"/>
  <circle cx="220" cy="170" r="280" fill="#06b6d4" opacity="0.25" filter="url(#glow-fe-be)"/>
  <circle cx="1020" cy="460" r="290" fill="#8b5cf6" opacity="0.24" filter="url(#glow-fe-be)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#164e63" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="88" y="67" fill="#a5f3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">ARCHITECTURE COMPARISON</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">Frontend vs Backend Development</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Client-Facing Aesthetics &amp; Interactivity vs Distributed Server Engines &amp; Data</text>

  <!-- Left: Frontend Arena -->
  <g transform="translate(70, 205)">
    <rect width="490" height="385" rx="20" fill="#042f2e" stroke="#14b8a6" stroke-width="2" filter="url(#soft-shadow-fe-be)"/>
    <rect x="30" y="25" width="180" height="32" rx="10" fill="#0f766e"/>
    <text x="45" y="46" fill="#ccfbf1" font-family="system-ui, sans-serif" font-size="13" font-weight="800">CLIENT-SIDE REALM</text>
    <text x="30" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="900">Frontend Engineering</text>
    
    <rect x="30" y="115" width="430" height="46" rx="10" fill="#134e4a"/>
    <text x="45" y="143" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">🎨 Focus: Human-Computer Interaction &amp; UI Speed</text>
    <rect x="30" y="170" width="430" height="46" rx="10" fill="#134e4a"/>
    <text x="45" y="198" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">⚡ Stack: React 19, Next.js, TypeScript, TailwindCSS</text>
    <rect x="30" y="225" width="430" height="46" rx="10" fill="#134e4a"/>
    <text x="45" y="253" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">📱 Deliverables: Responsive Layouts, SPAs &amp; PWAs</text>

    
  <g transform="translate(190, 260) scale(0.95)">
    <!-- Shadow -->
    <ellipse cx="65" cy="130" rx="45" ry="12" fill="#000000" opacity="0.4"/>
    <!-- Hoodie Body -->
    <path d="M 28 85 Q 65 60 102 85 L 110 125 L 20 125 Z" fill="#3b82f6"/>
    <!-- Hood Inner -->
    <path d="M 45 75 Q 65 65 85 75 L 85 85 Q 65 92 45 85 Z" fill="#1d4ed8"/>
    <!-- Head -->
    <circle cx="65" cy="46" r="30" fill="#fde047"/>
    <!-- Cool Hair -->
    <path d="M 38 42 Q 65 14 92 40 Q 82 22 65 24 Q 48 24 38 42 Z" fill="#92400e"/>
    <!-- Glasses -->
    <rect x="42" y="38" width="18" height="14" rx="4" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <rect x="70" y="38" width="18" height="14" rx="4" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <line x1="60" y1="44" x2="70" y2="44" stroke="#ffffff" stroke-width="2"/>
    <!-- Smile -->
    <path d="M 57 56 Q 65 62 73 56" stroke="#92400e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Laptop in hands -->
    <rect x="36" y="98" width="58" height="26" rx="4" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="30,124 100,124 94,128 36,128" fill="#475569"/>
    <!-- Screen Glow with code badge -->
    <rect x="42" y="103" width="46" height="16" rx="2" fill="#0f172a"/>
    <text x="46" y="115" fill="#14b8a6" font-family="monospace" font-size="8" font-weight="700">&lt;/dev&gt;</text>
  </g>

  </g>

  <!-- VS Badge in Middle -->
  <g transform="translate(565, 370)">
    <circle cx="35" cy="35" r="35" fill="#f59e0b" filter="url(#glow-fe-be)"/>
    <text x="21" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="900">VS</text>
  </g>

  <!-- Right: Backend Arena -->
  <g transform="translate(640, 205)">
    <rect width="490" height="385" rx="20" fill="#24103a" stroke="#a855f7" stroke-width="2" filter="url(#soft-shadow-fe-be)"/>
    <rect x="30" y="25" width="180" height="32" rx="10" fill="#6b21a8"/>
    <text x="45" y="46" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">SERVER-SIDE REALM</text>
    <text x="30" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="900">Backend Engineering</text>
    
    <rect x="30" y="115" width="430" height="46" rx="10" fill="#4c1d95"/>
    <text x="45" y="143" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">🛡️ Focus: Concurrency, Data Integrity &amp; Security</text>
    <rect x="30" y="170" width="430" height="46" rx="10" fill="#4c1d95"/>
    <text x="45" y="198" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">⚙️ Stack: Node.js, Go, Python, PostgreSQL, Redis</text>
    <rect x="30" y="225" width="430" height="46" rx="10" fill="#4c1d95"/>
    <text x="45" y="253" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">🗄️ Deliverables: REST / GraphQL APIs &amp; Pipelines</text>

    
  <g transform="translate(190, 260) scale(0.95)">
    <!-- Hover Thruster / Ring -->
    <ellipse cx="60" cy="118" rx="38" ry="12" fill="#a855f7" opacity="0.35"/>
    <ellipse cx="60" cy="118" rx="20" ry="6" fill="#ffffff" opacity="0.75"/>
    <!-- Bot Body -->
    <rect x="25" y="42" width="70" height="66" rx="22" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <rect x="33" y="50" width="54" height="42" rx="14" fill="#0f172a"/>
    <!-- Core Glow / Heartbeat -->
    <circle cx="60" cy="71" r="10" fill="#a855f7"/>
    <circle cx="60" cy="71" r="4" fill="#ffffff"/>
    <!-- Bot Head -->
    <rect x="18" y="6" width="84" height="46" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <!-- Visor -->
    <rect x="26" y="14" width="68" height="28" rx="12" fill="#090d16" stroke="#a855f7" stroke-width="1.5"/>
    <!-- Eyes -->
    <ellipse cx="44" cy="27" rx="8" ry="6" fill="#a855f7"/>
    <circle cx="46" cy="25" r="2.5" fill="#ffffff"/>
    <ellipse cx="76" cy="27" rx="8" ry="6" fill="#a855f7"/>
    <circle cx="78" cy="25" r="2.5" fill="#ffffff"/>
    <!-- Antennas -->
    <line x1="60" y1="6" x2="60" y2="-4" stroke="#64748b" stroke-width="3"/>
    <circle cx="60" cy="-6" r="5" fill="#a855f7"/>
    <!-- Little Hands -->
    <rect x="6" y="55" width="14" height="32" rx="7" fill="#334155"/>
    <rect x="100" y="55" width="14" height="32" rx="7" fill="#334155"/>
  </g>

  </g>
</svg>
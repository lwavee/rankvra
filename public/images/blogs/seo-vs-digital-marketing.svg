<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-seo-dm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow-card" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-seo-dm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#121b3a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#bg-seo-dm)"/>
  <circle cx="240" cy="180" r="260" fill="#38bdf8" opacity="0.22" filter="url(#glow-seo-dm)"/>
  <circle cx="980" cy="460" r="280" fill="#f59e0b" opacity="0.20" filter="url(#glow-seo-dm)"/>

  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <rect x="70" y="45" width="270" height="34" rx="17" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="88" y="67" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">GROWTH ARCHITECTURE</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">SEO vs Digital Marketing</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="17">Strategic Comparison: Channels, Customer Acquisition Costs, Timelines &amp; Synergies</text>

  <g transform="translate(70, 205)">
    <!-- SEO Box -->
    <rect x="0" y="0" width="490" height="385" rx="18" fill="#091e3a" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow-card)"/>
    <rect x="25" y="25" width="130" height="28" rx="14" fill="#0369a1"/>
    <text x="42" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">ORGANIC ENGINE</text>
    <text x="25" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Search Engine Optimization</text>
    <text x="25" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">A core discipline focusing on earning long-term, high-intent visibility in organic search engine algorithms without paying per click.</text>
    
    <g transform="translate(25, 160)">
      <rect x="0" y="0" width="440" height="42" rx="8" fill="#0c4a6e"/>
      <text x="15" y="26" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✓ Compounding ROI (zero recurring click bills)</text>
      <rect x="0" y="52" width="440" height="42" rx="8" fill="#0c4a6e"/>
      <text x="15" y="78" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✓ Captures active, high-intent buyer research</text>
      <rect x="0" y="104" width="440" height="42" rx="8" fill="#0c4a6e"/>
      <text x="15" y="130" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✓ Builds proprietary digital authority assets</text>
    </g>

    <!-- Digital Marketing Box -->
    <rect x="530" y="0" width="490" height="385" rx="18" fill="#2d1b06" stroke="#d97706" stroke-width="1.8" filter="url(#shadow-card)"/>
    <rect x="555" y="25" width="160" height="28" rx="14" fill="#b45309"/>
    <text x="572" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">HOLISTIC UMBRELLA</text>
    <text x="555" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Full Digital Marketing</text>
    <text x="555" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">The overarching framework encompassing PPC ads, social media, email nurturing, content funnels, PR, and omnichannel acquisition.</text>
    
    <g transform="translate(555, 160)">
      <rect x="0" y="0" width="440" height="42" rx="8" fill="#78350f"/>
      <text x="15" y="26" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✓ Instant traffic &amp; rapid hypothesis testing (PPC)</text>
      <rect x="0" y="52" width="440" height="42" rx="8" fill="#78350f"/>
      <text x="15" y="78" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✓ Multichannel touchpoints across the funnel</text>
      <rect x="0" y="104" width="440" height="42" rx="8" fill="#78350f"/>
      <text x="15" y="130" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✓ Immediate scale, but traffic ceases when ad budget stops</text>
    </g>
  </g>
</svg>

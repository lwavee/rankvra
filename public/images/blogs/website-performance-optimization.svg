<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-perf-opt" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-perf-opt" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-perf-opt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06261f"/>
      <stop offset="50%" stop-color="#0a382e"/>
      <stop offset="100%" stop-color="#030f0c"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-perf-opt)"/>
  <circle cx="220" cy="170" r="280" fill="#10b981" opacity="0.25" filter="url(#glow-perf-opt)"/>
  <circle cx="1020" cy="460" r="290" fill="#06b6d4" opacity="0.24" filter="url(#glow-perf-opt)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
  <text x="88" y="67" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">LIGHTHOUSE ACCELERATION</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">Website Performance Optimization</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Core Web Vitals Engineering: Sub-800ms LCP, Zero CLS &amp; Instant Interaction (INP)</text>

  <!-- Lighthouse Score Dashboard -->
  <g transform="translate(70, 205)">
    <!-- 4 Lighthouse Badges -->
    <g transform="translate(0, 0)">
      <!-- Badge 1: Performance 100 -->
      <rect x="0" y="0" width="245" height="150" rx="16" fill="#08241d" stroke="#10b981" stroke-width="2" filter="url(#soft-shadow-perf-opt)"/>
      <circle cx="70" cy="75" r="45" fill="none" stroke="#10b981" stroke-width="8"/>
      <text x="50" y="83" fill="#10b981" font-family="system-ui, sans-serif" font-size="26" font-weight="900">100</text>
      <text x="135" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Performance</text>
      <text x="135" y="92" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">Sub-0.8s LCP</text>

      <!-- Badge 2: Accessibility 100 -->
      <rect x="270" y="0" width="245" height="150" rx="16" fill="#08241d" stroke="#10b981" stroke-width="2" filter="url(#soft-shadow-perf-opt)"/>
      <circle cx="340" cy="75" r="45" fill="none" stroke="#10b981" stroke-width="8"/>
      <text x="320" y="83" fill="#10b981" font-family="system-ui, sans-serif" font-size="26" font-weight="900">100</text>
      <text x="405" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Accessibility</text>
      <text x="405" y="92" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">WCAG AAA</text>

      <!-- Badge 3: Best Practices 100 -->
      <rect x="540" y="0" width="245" height="150" rx="16" fill="#08241d" stroke="#10b981" stroke-width="2" filter="url(#soft-shadow-perf-opt)"/>
      <circle cx="610" cy="75" r="45" fill="none" stroke="#10b981" stroke-width="8"/>
      <text x="590" y="83" fill="#10b981" font-family="system-ui, sans-serif" font-size="26" font-weight="900">100</text>
      <text x="675" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Best Practices</text>
      <text x="675" y="92" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">Modern Web API</text>

      <!-- Badge 4: SEO 100 -->
      <rect x="810" y="0" width="250" height="150" rx="16" fill="#08241d" stroke="#10b981" stroke-width="2" filter="url(#soft-shadow-perf-opt)"/>
      <circle cx="880" cy="75" r="45" fill="none" stroke="#10b981" stroke-width="8"/>
      <text x="860" y="83" fill="#10b981" font-family="system-ui, sans-serif" font-size="26" font-weight="900">100</text>
      <text x="945" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="800">SEO Quality</text>
      <text x="945" y="92" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">Clean Semantics</text>
    </g>

    <!-- Optimization Tactics Strip -->
    <g transform="translate(0, 180)">
      <rect width="680" height="205" rx="16" fill="#061f18" stroke="#10b981" stroke-width="1.8" filter="url(#soft-shadow-perf-opt)"/>
      <text x="30" y="38" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="800">CORE TECHNICAL TACTICS</text>
      
      <rect x="30" y="55" width="620" height="38" rx="8" fill="#064e3b" fill-opacity="0.5"/>
      <text x="45" y="79" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">⚡ Image Modernization: WebP/AVIF with responsive srcset sizing</text>
      <rect x="30" y="103" width="620" height="38" rx="8" fill="#064e3b" fill-opacity="0.5"/>
      <text x="45" y="127" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">⚡ Code Splitting: Dynamic imports &amp; tree-shaking dead JS bundles</text>
      <rect x="30" y="151" width="620" height="38" rx="8" fill="#064e3b" fill-opacity="0.5"/>
      <text x="45" y="175" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">⚡ Font Optimization: next/font zero render-blocking Google Fonts</text>

      <!-- Right Character Stage -->
      <g transform="translate(710, 0)">
        <rect width="350" height="205" rx="16" fill="#081e28" stroke="#06b6d4" stroke-width="1.8" filter="url(#soft-shadow-perf-opt)"/>
        
  <g transform="translate(30, 20) scale(1.1)">
    <ellipse cx="65" cy="130" rx="45" ry="12" fill="#000000" opacity="0.4"/>
    <path d="M 28 85 Q 65 60 102 85 L 110 125 L 20 125 Z" fill="#3b82f6"/>
    <path d="M 45 75 Q 65 65 85 75 L 85 85 Q 65 92 45 85 Z" fill="#1d4ed8"/>
    <circle cx="65" cy="46" r="30" fill="#fde047"/>
    <path d="M 38 42 Q 65 14 92 40 Q 82 22 65 24 Q 48 24 38 42 Z" fill="#92400e"/>
    <rect x="42" y="38" width="18" height="14" rx="4" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <rect x="70" y="38" width="18" height="14" rx="4" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <line x1="60" y1="44" x2="70" y2="44" stroke="#ffffff" stroke-width="2"/>
    <path d="M 57 56 Q 65 62 73 56" stroke="#92400e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <rect x="36" y="98" width="58" height="26" rx="4" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="30,124 100,124 94,128 36,128" fill="#475569"/>
    <rect x="42" y="103" width="46" height="16" rx="2" fill="#0f172a"/>
    <text x="46" y="115" fill="#06b6d4" font-family="monospace" font-size="8" font-weight="700">&lt;/dev&gt;</text>
  </g>

        <rect x="180" y="40" width="150" height="50" rx="10" fill="#0e7490"/>
        <text x="195" y="65" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Speed Champ</text>
        <text x="195" y="82" fill="#cffafe" font-family="system-ui, sans-serif" font-size="11">Sub-1s Across USA/UK</text>
      </g>
    </g>
  </g>
</svg>
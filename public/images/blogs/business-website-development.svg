<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-web-dev" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow-card" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-web-dev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091429"/>
      <stop offset="50%" stop-color="#102042"/>
      <stop offset="100%" stop-color="#030814"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#bg-web-dev)"/>
  <circle cx="210" cy="170" r="270" fill="#38bdf8" opacity="0.22" filter="url(#glow-web-dev)"/>
  <circle cx="1010" cy="460" r="280" fill="#6366f1" opacity="0.22" filter="url(#glow-web-dev)"/>

  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <rect x="70" y="45" width="280" height="34" rx="17" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="88" y="67" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">FULL-STACK WEB BLUEPRINT</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">Business Website Development Guide</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="17">Modern Architecture, Conversion UX, Core Web Vitals, Security &amp; Launch Checklist</text>

  <g transform="translate(70, 205)">
    <!-- Column 1 -->
    <rect x="0" y="0" width="320" height="385" rx="18" fill="#0b223c" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow-card)"/>
    <circle cx="45" cy="45" r="20" fill="#0369a1"/>
    <text x="36" y="52" fill="#ffffff" font-size="16">💻</text>
    <text x="25" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">1. Next-Gen Tech Stack</text>
    <text x="25" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Next.js App Router, SSR, Tailwind CSS, API endpoints, edge deployment, and resilient relational database models.</text>
    <rect x="25" y="220" width="270" height="42" rx="8" fill="#075985"/>
    <text x="40" y="246" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Sub-Second Load Times</text>

    <!-- Column 2 -->
    <rect x="360" y="0" width="320" height="385" rx="18" fill="#141a3a" stroke="#6366f1" stroke-width="1.8" filter="url(#shadow-card)"/>
    <circle cx="405" cy="45" r="20" fill="#4f46e5"/>
    <text x="396" y="52" fill="#ffffff" font-size="16">🎯</text>
    <text x="385" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">2. Conversion UX</text>
    <text x="385" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">High-converting above-the-fold value hooks, frictionless mobile inquiry forms, WhatsApp integration, and trust proof triggers.</text>
    <rect x="385" y="220" width="270" height="42" rx="8" fill="#312e81"/>
    <text x="400" y="246" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="700">3x Pipeline Inquiries</text>

    <!-- Column 3 -->
    <rect x="720" y="0" width="320" height="385" rx="18" fill="#0c2d25" stroke="#10b981" stroke-width="1.8" filter="url(#shadow-card)"/>
    <circle cx="765" cy="45" r="20" fill="#059669"/>
    <text x="756" y="52" fill="#ffffff" font-size="16">🛡️</text>
    <text x="745" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">3. SEO &amp; Security</text>
    <text x="745" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Clean semantic HTML5, Schema.org JSON-LD graphs, automated XML sitemaps, CSP security headers, and WCAG accessibility.</text>
    <rect x="745" y="220" width="270" height="42" rx="8" fill="#064e3b"/>
    <text x="760" y="246" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Production Launch Ready</text>
  </g>
</svg>

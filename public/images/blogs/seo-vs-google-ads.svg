<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" rx="24" fill="#0f172a"/>
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <defs>
    <filter id="b1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="b2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>
  <!-- Glow Accents -->
  <circle cx="200" cy="180" r="220" fill="#4f46e5" opacity="0.2" filter="url(#b1)"/>
  <circle cx="1000" cy="420" r="220" fill="#f59e0b" opacity="0.18" filter="url(#b2)"/>

  <!-- Badge -->
  <rect x="80" y="70" width="220" height="38" rx="19" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="100" y="94" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">MARKETING STRATEGY</text>

  <!-- Title & Subtitle -->
  <text x="80" y="160" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">SEO vs Google Ads:</text>
  <text x="80" y="215" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Which Is Better for Your Business?</text>
  <text x="80" y="265" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">An objective analysis of CAC, speed to lead, compounding equity &amp; the hybrid growth framework.</text>

  <!-- Comparison Columns -->
  <g transform="translate(80, 310)">
    <!-- SEO Box -->
    <rect width="490" height="240" rx="18" fill="#1e293b" stroke="#4f46e5" stroke-width="1.5"/>
    <rect x="24" y="24" width="36" height="36" rx="8" fill="#312e81"/>
    <text x="75" y="48" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Search Engine Optimization (SEO)</text>
    <text x="24" y="95" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Compounding Long-Term Asset</text>
    <text x="24" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Zero cost per click; compounding organic equity</text>
    <text x="24" y="150" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Captures 70%+ of search click share</text>
    <text x="24" y="175" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Requires 3 to 6 months foundational runway</text>
    <rect x="24" y="195" width="135" height="24" rx="6" fill="#4f46e5" opacity="0.2"/>
    <text x="34" y="211" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">HIGH LONG-TERM ROI</text>
  </g>

  <g transform="translate(610, 310)">
    <!-- Google Ads Box -->
    <rect width="510" height="240" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="24" y="24" width="36" height="36" rx="8" fill="#451a03"/>
    <text x="75" y="48" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Google Ads (PPC Search)</text>
    <text x="24" y="95" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Instant Intent &amp; Immediate Leads</text>
    <text x="24" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Instant Page 1 visibility within 24 hours</text>
    <text x="24" y="150" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Highly controllable budget &amp; geographic geotargeting</text>
    <text x="24" y="175" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">&#8226; Traffic stops immediately when budget ends</text>
    <rect x="24" y="195" width="130" height="24" rx="6" fill="#f59e0b" opacity="0.15"/>
    <text x="34" y="211" fill="#fcd34d" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">SPEED TO PIPELINE</text>
  </g>

  <!-- RankVRA Signature -->
  <text x="1120" y="585" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="end">RankVRA Growth Advisory &#8226; Udaipur</text>
</svg>

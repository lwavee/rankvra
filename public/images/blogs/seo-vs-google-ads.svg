<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-seo-ads" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-seo-ads" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-seo-ads" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09152b"/>
      <stop offset="50%" stop-color="#10223d"/>
      <stop offset="100%" stop-color="#030812"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-seo-ads)"/>
  <circle cx="220" cy="170" r="280" fill="#10b981" opacity="0.25" filter="url(#glow-seo-ads)"/>
  <circle cx="1020" cy="460" r="290" fill="#f59e0b" opacity="0.24" filter="url(#glow-seo-ads)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
  <text x="88" y="67" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">ACQUISITION STRATEGY</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">SEO vs Google Ads</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Compounding Organic Equity vs Instant Pay-Per-Click Cash-Flow Acceleration</text>

  <!-- Arena Comparison -->
  <g transform="translate(70, 205)">
    <!-- Organic SEO -->
    <rect width="490" height="385" rx="20" fill="#08241d" stroke="#10b981" stroke-width="2" filter="url(#soft-shadow-seo-ads)"/>
    <rect x="30" y="25" width="180" height="32" rx="10" fill="#047857"/>
    <text x="45" y="46" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="13" font-weight="800">ORGANIC SEO ASSET</text>
    <text x="30" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Compounding Long-Term ROI</text>
    
    <rect x="30" y="115" width="430" height="42" rx="8" fill="#064e3b"/>
    <text x="45" y="141" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">✔ Free clicks 24/7 once ranked in top 3 positions</text>
    <rect x="30" y="165" width="430" height="42" rx="8" fill="#064e3b"/>
    <text x="45" y="191" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">✔ Builds brand trust &amp; domain equity value</text>
    <rect x="30" y="215" width="430" height="42" rx="8" fill="#064e3b"/>
    <text x="45" y="241" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">✔ Zero cost per click even at 100,000 visits/month</text>

    
  <g transform="translate(360, 255) scale(0.95)">
    <ellipse cx="60" cy="118" rx="38" ry="12" fill="#10b981" opacity="0.35"/>
    <ellipse cx="60" cy="118" rx="20" ry="6" fill="#ffffff" opacity="0.75"/>
    <rect x="25" y="42" width="70" height="66" rx="22" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <rect x="33" y="50" width="54" height="42" rx="14" fill="#0f172a"/>
    <circle cx="60" cy="71" r="10" fill="#10b981"/>
    <circle cx="60" cy="71" r="4" fill="#ffffff"/>
    <rect x="18" y="6" width="84" height="46" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <rect x="26" y="14" width="68" height="28" rx="12" fill="#090d16" stroke="#10b981" stroke-width="1.5"/>
    <ellipse cx="44" cy="27" rx="8" ry="6" fill="#10b981"/>
    <circle cx="46" cy="25" r="2.5" fill="#ffffff"/>
    <ellipse cx="76" cy="27" rx="8" ry="6" fill="#10b981"/>
    <circle cx="78" cy="25" r="2.5" fill="#ffffff"/>
    <line x1="60" y1="6" x2="60" y2="-4" stroke="#64748b" stroke-width="3"/>
    <circle cx="60" cy="-6" r="5" fill="#10b981"/>
    <rect x="6" y="55" width="14" height="32" rx="7" fill="#334155"/>
    <rect x="100" y="55" width="14" height="32" rx="7" fill="#334155"/>
  </g>

    <rect x="30" y="320" width="220" height="42" rx="10" fill="#047857"/>
    <text x="45" y="346" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Compounding Equity</text>
  </g>

  <!-- VS Badge -->
  <g transform="translate(565, 370)">
    <circle cx="35" cy="35" r="35" fill="#f59e0b" filter="url(#glow-seo-ads)"/>
    <text x="21" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="900">VS</text>
  </g>

  <!-- Google Ads PPC -->
  <g transform="translate(640, 205)">
    <rect width="490" height="385" rx="20" fill="#2d1c07" stroke="#f59e0b" stroke-width="2" filter="url(#soft-shadow-seo-ads)"/>
    <rect x="30" y="25" width="180" height="32" rx="10" fill="#b45309"/>
    <text x="45" y="46" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="13" font-weight="800">GOOGLE ADS PPC</text>
    <text x="30" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Instant Speed &amp; Testing</text>
    
    <rect x="30" y="115" width="430" height="42" rx="8" fill="#78350f"/>
    <text x="45" y="141" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">⚡ Immediate leads within 2 hours of campaign launch</text>
    <rect x="30" y="165" width="430" height="42" rx="8" fill="#78350f"/>
    <text x="45" y="191" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">⚡ Precise geographic &amp; device targeting control</text>
    <rect x="30" y="215" width="430" height="42" rx="8" fill="#78350f"/>
    <text x="45" y="241" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">⚠️ Traffic immediately drops to zero if ad spend halts</text>

    
  <g transform="translate(360, 255) scale(0.95)">
    <ellipse cx="65" cy="130" rx="45" ry="12" fill="#000000" opacity="0.4"/>
    <path d="M 28 85 Q 65 60 102 85 L 110 125 L 20 125 Z" fill="#3b82f6"/>
    <path d="M 45 75 Q 65 65 85 75 L 85 85 Q 65 92 45 85 Z" fill="#1d4ed8"/>
    <circle cx="65" cy="46" r="30" fill="#fde047"/>
    <path d="M 38 42 Q 65 14 92 40 Q 82 22 65 24 Q 48 24 38 42 Z" fill="#92400e"/>
    <rect x="42" y="38" width="18" height="14" rx="4" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <rect x="70" y="38" width="18" height="14" rx="4" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <line x1="60" y1="44" x2="70" y2="44" stroke="#ffffff" stroke-width="2"/>
    <path d="M 57 56 Q 65 62 73 56" stroke="#92400e" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <rect x="36" y="98" width="58" height="26" rx="4" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="30,124 100,124 94,128 36,128" fill="#475569"/>
    <rect x="42" y="103" width="46" height="16" rx="2" fill="#0f172a"/>
    <text x="46" y="115" fill="#f59e0b" font-family="monospace" font-size="8" font-weight="700">&lt;/dev&gt;</text>
  </g>

    <rect x="30" y="320" width="220" height="42" rx="10" fill="#b45309"/>
    <text x="45" y="346" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Instant Scalability</text>
  </g>

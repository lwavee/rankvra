<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-full-stack" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-full-stack" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-full-stack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180d2b"/>
      <stop offset="50%" stop-color="#0a1026"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>
    <linearGradient id="glass-full-stack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-full-stack)"/>
  <circle cx="220" cy="170" r="280" fill="#a855f7" opacity="0.25" filter="url(#glow-full-stack)"/>
  <circle cx="1020" cy="460" r="290" fill="#3b82f6" opacity="0.24" filter="url(#glow-full-stack)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#581c87" stroke="#c084fc" stroke-width="1.5"/>
  <text x="88" y="67" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">FULL SPECTRUM ROADMAP</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">Full-Stack Web Development</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Unifying Client Experience, Server Logic, Database Ops &amp; DevOps Delivery</text>

  <!-- 4 Stack Layers Deck -->
  <g transform="translate(70, 205)">
    <!-- Layer 1 -->
    <rect x="0" y="0" width="700" height="80" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.8" filter="url(#soft-shadow-full-stack)"/>
    <rect x="20" y="20" width="160" height="40" rx="8" fill="#4338ca"/>
    <text x="35" y="45" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">FRONTEND LAYER</text>
    <text x="200" y="47" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">React 19 • Next.js App Router • TailwindCSS • TypeScript • Zustand</text>

    <!-- Layer 2 -->
    <rect x="0" y="95" width="700" height="80" rx="14" fill="#0f2b38" stroke="#06b6d4" stroke-width="1.8" filter="url(#soft-shadow-full-stack)"/>
    <rect x="20" y="115" width="160" height="40" rx="8" fill="#0e7490"/>
    <text x="35" y="140" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">BACKEND TIER</text>
    <text x="200" y="142" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Node.js • Python / FastAPI • REST • tRPC • WebSocket Real-Time</text>

    <!-- Layer 3 -->
    <rect x="0" y="190" width="700" height="80" rx="14" fill="#062e24" stroke="#10b981" stroke-width="1.8" filter="url(#soft-shadow-full-stack)"/>
    <rect x="20" y="210" width="160" height="40" rx="8" fill="#047857"/>
    <text x="35" y="235" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">DATA TIER</text>
    <text x="200" y="237" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">PostgreSQL • Prisma ORM • Redis In-Memory Cache • Vector Embeddings</text>

    <!-- Layer 4 -->
    <rect x="0" y="285" width="700" height="80" rx="14" fill="#31132a" stroke="#ec4899" stroke-width="1.8" filter="url(#soft-shadow-full-stack)"/>
    <rect x="20" y="305" width="160" height="40" rx="8" fill="#be185d"/>
    <text x="35" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">DEVOPS &amp; CI/CD</text>
    <text x="200" y="332" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">Docker • GitHub Actions • AWS / Vercel Edge • Automated Quality Gates</text>
  </g>

  <!-- Right Visual Stage with Character Pair -->
  <g transform="translate(805, 205)">
    <rect width="325" height="365" rx="20" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#soft-shadow-full-stack)"/>
    <text x="30" y="45" fill="#a855f7" font-family="system-ui, sans-serif" font-size="16" font-weight="800">FULL-STACK TEAM BOT</text>
    <text x="30" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Continuous Integration Guard</text>
    
  <g transform="translate(100, 95) scale(1.25)">
    <!-- Hover Thruster / Ring -->
    <ellipse cx="60" cy="118" rx="38" ry="12" fill="#c084fc" opacity="0.35"/>
    <ellipse cx="60" cy="118" rx="20" ry="6" fill="#ffffff" opacity="0.75"/>
    <!-- Bot Body -->
    <rect x="25" y="42" width="70" height="66" rx="22" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <rect x="33" y="50" width="54" height="42" rx="14" fill="#0f172a"/>
    <!-- Core Glow / Heartbeat -->
    <circle cx="60" cy="71" r="10" fill="#c084fc"/>
    <circle cx="60" cy="71" r="4" fill="#ffffff"/>
    <!-- Bot Head -->
    <rect x="18" y="6" width="84" height="46" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <!-- Visor -->
    <rect x="26" y="14" width="68" height="28" rx="12" fill="#090d16" stroke="#c084fc" stroke-width="1.5"/>
    <!-- Eyes -->
    <ellipse cx="44" cy="27" rx="8" ry="6" fill="#c084fc"/>
    <circle cx="46" cy="25" r="2.5" fill="#ffffff"/>
    <ellipse cx="76" cy="27" rx="8" ry="6" fill="#c084fc"/>
    <circle cx="78" cy="25" r="2.5" fill="#ffffff"/>
    <!-- Antennas -->
    <line x1="60" y1="6" x2="60" y2="-4" stroke="#64748b" stroke-width="3"/>
    <circle cx="60" cy="-6" r="5" fill="#c084fc"/>
    <!-- Little Hands -->
    <rect x="6" y="55" width="14" height="32" rx="7" fill="#334155"/>
    <rect x="100" y="55" width="14" height="32" rx="7" fill="#334155"/>
  </g>

    <rect x="25" y="260" width="275" height="75" rx="12" fill="#1e293b"/>
    <text x="40" y="288" fill="#38bdf8" font-family="monospace" font-size="12">&gt; git push origin main</text>
    <text x="40" y="308" fill="#34d399" font-family="monospace" font-size="12">✔ Build: 100% Passed</text>
    <text x="40" y="325" fill="#facc15" font-family="monospace" font-size="11">🚀 Deployed to Edge in 18s</text>
  </g>
</svg>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <filter id="glow-saas-guide" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft-shadow-saas-guide" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="bg-saas-guide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e143b"/>
      <stop offset="50%" stop-color="#0d1029"/>
      <stop offset="100%" stop-color="#050714"/>
    </linearGradient>
    <linearGradient id="glass-saas-guide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  
  <rect width="1200" height="630" rx="28" fill="url(#bg-saas-guide)"/>
  <circle cx="220" cy="170" r="280" fill="#8b5cf6" opacity="0.25" filter="url(#glow-saas-guide)"/>
  <circle cx="1020" cy="460" r="290" fill="#06b6d4" opacity="0.24" filter="url(#glow-saas-guide)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  
  <rect x="70" y="45" width="280" height="34" rx="17" fill="#581c87" stroke="#c084fc" stroke-width="1.5"/>
  <text x="88" y="67" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1.2">B2B SAAS BLUEPRINT</text>
  <text x="70" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="-1">SaaS Product Engineering Guide</text>
  <text x="70" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18">Multi-Tenancy, Automated Billing Workflows &amp; Churn-Proof Onboarding</text>

  <!-- Pipeline: 4 Pillars -->
  <g transform="translate(70, 205)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="250" height="385" rx="18" fill="#131136" stroke="#6366f1" stroke-width="1.8" filter="url(#soft-shadow-saas-guide)"/>
    <circle cx="45" cy="45" r="20" fill="#4338ca"/>
    <text x="36" y="52" fill="#ffffff" font-size="16">🏢</text>
    <text x="25" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Multi-Tenancy</text>
    <text x="25" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Row-level security in PostgreSQL or schema-per-tenant isolation for zero leak.</text>
    <rect x="25" y="195" width="200" height="40" rx="8" fill="#312e81"/>
    <text x="35" y="220" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Strict Data Guard</text>

    <!-- Card 2 -->
    <rect x="270" y="0" width="250" height="385" rx="18" fill="#0a2a33" stroke="#06b6d4" stroke-width="1.8" filter="url(#soft-shadow-saas-guide)"/>
    <circle cx="315" cy="45" r="20" fill="#0e7490"/>
    <text x="306" y="52" fill="#ffffff" font-size="16">💳</text>
    <text x="295" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Recurring Billing</text>
    <text x="295" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Stripe customer portal, tier upgrading, dunning webhooks and tax calculation.</text>
    <rect x="295" y="195" width="200" height="40" rx="8" fill="#164e63"/>
    <text x="305" y="220" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Zero Invoicing Leak</text>

    <!-- Card 3 -->
    <rect x="540" y="0" width="250" height="385" rx="18" fill="#2d1330" stroke="#ec4899" stroke-width="1.8" filter="url(#soft-shadow-saas-guide)"/>
    <circle cx="585" cy="45" r="20" fill="#be185d"/>
    <text x="576" y="52" fill="#ffffff" font-size="16">✨</text>
    <text x="565" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Self Onboarding</text>
    <text x="565" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Instant interactive product tour, workspace invitation &amp; demo sample data.</text>
    <rect x="565" y="195" width="200" height="40" rx="8" fill="#831843"/>
    <text x="575" y="220" fill="#f472b6" font-family="system-ui, sans-serif" font-size="12" font-weight="700">65% Activation</text>

    <!-- Card 4: Mascot & Analytics -->
    <rect x="810" y="0" width="250" height="385" rx="18" fill="#0e2417" stroke="#10b981" stroke-width="1.8" filter="url(#soft-shadow-saas-guide)"/>
    <circle cx="855" cy="45" r="20" fill="#047857"/>
    <text x="846" y="52" fill="#ffffff" font-size="16">📈</text>
    <text x="835" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Telemetry Bot</text>
    <text x="835" y="125" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">Churn prediction, feature adoption alerts &amp; real-time health checks.</text>
    
  <g transform="translate(870, 185) scale(0.95)">
    <!-- Hover Thruster / Ring -->
    <ellipse cx="60" cy="118" rx="38" ry="12" fill="#10b981" opacity="0.35"/>
    <ellipse cx="60" cy="118" rx="20" ry="6" fill="#ffffff" opacity="0.75"/>
    <!-- Bot Body -->
    <rect x="25" y="42" width="70" height="66" rx="22" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <rect x="33" y="50" width="54" height="42" rx="14" fill="#0f172a"/>
    <!-- Core Glow / Heartbeat -->
    <circle cx="60" cy="71" r="10" fill="#10b981"/>
    <circle cx="60" cy="71" r="4" fill="#ffffff"/>
    <!-- Bot Head -->
    <rect x="18" y="6" width="84" height="46" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <!-- Visor -->
    <rect x="26" y="14" width="68" height="28" rx="12" fill="#090d16" stroke="#10b981" stroke-width="1.5"/>
    <!-- Eyes -->
    <ellipse cx="44" cy="27" rx="8" ry="6" fill="#10b981"/>
    <circle cx="46" cy="25" r="2.5" fill="#ffffff"/>
    <ellipse cx="76" cy="27" rx="8" ry="6" fill="#10b981"/>
    <circle cx="78" cy="25" r="2.5" fill="#ffffff"/>
    <!-- Antennas -->
    <line x1="60" y1="6" x2="60" y2="-4" stroke="#64748b" stroke-width="3"/>
    <circle cx="60" cy="-6" r="5" fill="#10b981"/>
    <!-- Little Hands -->
    <rect x="6" y="55" width="14" height="32" rx="7" fill="#334155"/>
    <rect x="100" y="55" width="14" height="32" rx="7" fill="#334155"/>
  </g>

    <rect x="835" y="320" width="200" height="40" rx="8" fill="#047857"/>
    <text x="845" y="345" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Health: 99.4/100</text>
  </g>
</svg>